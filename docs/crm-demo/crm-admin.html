                <label>说明<input id="batchNote" maxlength="80" value="${E(draft.note)}" placeholder="必填：活动名或差错单号"></label>
                <div style="display:flex;gap:8px"><button class="btn" data-act="batchCheck">校验预览</button><button class="btn primary" data-act="batchSubmit" ${draft.rows && draft.rows.length && !draft.rows.some((r) => r.err) ? '' : 'disabled'}>提交审批</button></div>

          <td>${a.lines.length === 1 ? E(C.member(a.lines[0].no).name) : `${E(C.member(a.lines[0].no).name)} 等 ${a.lines.length} 人`}</td><td class="r num">${signed(total(a))}</td>

          <td><button class="text-btn">${a.status === 'PENDING' && !approveBlock(a) ? '审批 ›' : '查看 ›'}</button></td></tr>`).join('')

<script>/* ==== page-benefits.js ==== */

 * 大会员卡：基础信息、三端权益、规则与版本在 CRM 维护；新版本只对生效后的新购生效，已售卡按开卡快照执行。
 * 业务会员卡：各业务系统自有卡种，CRM 只同步基础信息，不提供开卡、核销、退卡等操作。
 */
(function () {
  const C = window.CRM;
  const E = C.esc;
  const P = C.CARD_PRODUCT;
  const VSTATUS = { CURRENT: ['现行', 'green'], SCHEDULED: ['待生效', 'lilac'], RETIRED: ['已停用', ''], CANCELED: ['已撤销', 'red'] };
  const RULE_TEXT = { sx: '每杯固定减额', ql: '预约折扣', zc: '课程会员价' };

  C.pages.brandcard = {
    title: '大会员卡',
    render() {
      const edit = C.can('card:edit');
      const cur = P.versions.find((v) => v.status === 'CURRENT');
      const sched = P.versions.find((v) => v.status === 'SCHEDULED');
      const sold = Object.values(P.stats.soldMonth).reduce((s, v) => s + v, 0);
      return `
        <div class="page-head"><div><h1>Full愈 大会员卡</h1><p>品牌大会员卡的基础信息、三端权益与规则统一在 CRM 管理；修改即生成新版本，只对生效后的新购生效，已售卡按开卡快照执行。</p></div>
          <button class="btn primary" data-act="cardNewVersion" ${edit && !sched ? '' : `disabled title="${edit ? '已有待生效版本，先撤销或等待生效' : '当前角色无 card:edit 权限'}"`}>编辑为新版本</button></div>
        <div class="stats-grid">
          <div class="stat emphasis"><div class="label">生效中</div><div class="value">${C.n(P.stats.active)}<small>张</small></div><div class="sub">30 天内到期 ${P.stats.expiring30} 张</div></div>
          <div class="stat"><div class="label">本月售出</div><div class="value">${sold}<small>张</small></div><div class="sub">${Object.entries(P.stats.soldMonth).map(([b, v]) => `${C.BIZ[b].n} ${v}`).join(' · ')}</div></div>
          <div class="stat"><div class="label">售价（示例）</div><div class="value">${C.yuan(P.price)}</div><div class="sub">待经营确认 · 三端同价</div></div>
          <div class="stat"><div class="label">有效期（示例）</div><div class="value">${P.days}<small>天</small></div><div class="sub">从支付成功起算；续费接在最晚到期日后</div></div>
        </div>
        <div class="grid-2" style="grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)">
          <div class="stack">
            <section class="panel"><div class="section-title"><h2>三端权益</h2><span class="tiny">现行 v${cur.v} · 开卡时写入卡期快照</span></div>
              <div class="table-wrap"><table><thead><tr><th>业务</th><th>权益 / 规则快照</th><th>规则类型</th></tr></thead><tbody>
              ${Object.entries(P.benefits).map(([b, s]) => `<tr><td>${C.biz(b)}</td><td class="wrap"><strong>${E(s.text)}</strong><span class="mono tiny rule-json">${E(s.rule)}</span></td><td>${RULE_TEXT[b]}</td></tr>`).join('')}
              </tbody></table></div>
              <p class="tiny muted" style="margin-top:10px">业务端按快照计算优惠并回传 usage（已省金额），CRM 累计「已享优惠」用于退卡测算与月度对账。</p></section>
            <section class="panel"><div class="section-title"><h2>版本</h2><span class="tiny">只追加；生效时刻之后的新购使用新版本</span></div>
              <div class="table-wrap"><table><thead><tr><th>版本</th><th>生效时间</th><th>变更</th><th>修改人</th><th>状态</th><th></th></tr></thead><tbody>
              ${P.versions.map((v) => `<tr><td class="mono">v${v.v}</td><td class="num">${v.at}</td><td class="wrap">${E(v.change)}</td><td>${E(v.by)}</td><td>${C.pill(...VSTATUS[v.status])}</td>
                <td>${v.status === 'SCHEDULED' && edit ? `<button class="text-btn" data-act="cardCancelVersion" data-v="${v.v}">撤销</button>` : ''}</td></tr>`).join('')}
              </tbody></table></div></section>
          </div>
          <div class="stack">
            <div class="card-visual"><div class="eyebrow">FULL YU ANNUAL MEMBER</div><h3>${E(P.name)}</h3><p>${E(P.subtitle)}</p>
              <p style="margin-top:10px">${C.yuan(P.price)} / ${P.days} 天 · 产品编码 <span class="mono">${P.code}</span></p></div>
            <section class="panel"><div class="section-title"><h2>基础信息</h2></div>
              <dl class="kv"><dt>卡名</dt><dd>${E(P.name)}</dd><dt>编码</dt><dd class="mono">${P.code}</dd>
                <dt>售卖渠道</dt><dd><span class="chips">${P.channels.map(C.biz).join('')}</span></dd>
                <dt>收款</dt><dd>哪里卖哪里收：各业务自有商户</dd><dt>现行版本</dt><dd>v${cur.v} · ${cur.at} 起</dd>
                ${sched ? `<dt>待生效</dt><dd>${C.pill(`v${sched.v} · ${sched.at}`, 'lilac')}</dd>` : ''}</dl></section>
            <section class="panel"><div class="section-title"><h2>规则</h2></div>
              <ul class="small muted" style="margin:0;padding-left:18px;line-height:1.9">${P.rules.map((r) => `<li>${E(r)}</li>`).join('')}</ul></section>
          </div>
        </div>`;
    }
  };

  C.act.cardNewVersion = () => {
    const field = (b) => `<label>${C.BIZ[b].n}权益<input id="cv_${b}" maxlength="30" value="${E(P.benefits[b].text)}"></label>`;
    C.dialog('编辑为新版本',
      `<div class="form">
        <div class="note">已售卡按开卡快照执行，不受影响；新版本只对生效时间之后的新购生效。</div>
        <div class="grid-2" style="grid-template-columns:1fr 1fr;gap:10px"><label>售价（元）<input id="cvPrice" type="number" min="1" step="1" value="${P.price / 100}"></label><label>有效天数<input id="cvDays" type="number" min="1" step="1" value="${P.days}"></label></div>
        ${P.channels.map(field).join('')}
        <label>生效日期<input id="cvAt" type="date" min="${nextDay(C.TODAY)}" value="${nextDay(C.TODAY)}"></label>
        <label>变更说明<input id="cvNote" maxlength="60" placeholder="必填：如「在场权益改为课程 9 折」"></label>
        <p id="cvErr" class="tiny err" hidden></p></div>`,
      `<button class="btn" data-act="closeDlg">取消</button><button class="btn primary" data-act="cardSaveVersion">保存为待生效版本</button>`);
  };
  /* 本地日期 +1（不用 toISOString，避免 UTC 偏移成前一天） */
  function nextDay(d) { const t = new Date(d + 'T00:00:00'); t.setDate(t.getDate() + 1); return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`; }
  C.act.cardSaveVersion = () => {
    const err = (t) => { const e = document.getElementById('cvErr'); e.textContent = t; e.hidden = false; };
    const price = Number(document.getElementById('cvPrice').value);
    const days = Number(document.getElementById('cvDays').value);
    const at = document.getElementById('cvAt').value;
    const note = document.getElementById('cvNote').value.trim();
    if (!Number.isInteger(price) || price <= 0) return err('售价须为正整数（元）');
    if (!Number.isInteger(days) || days <= 0) return err('有效天数须为正整数');
    if (!at || at <= C.TODAY) return err('生效日期须晚于今天（不追溯、不即时覆盖）');
    if (note.length < 2) return err('请填写变更说明');
    const benefits = {};
    for (const b of P.channels) { const v = document.getElementById(`cv_${b}`).value.trim(); if (!v) return err(`${C.BIZ[b].n}权益不能为空`); benefits[b] = v; }
    const v = Math.max(...P.versions.map((x) => x.v)) + 1;
    P.versions.unshift({ v, at: `${at} 00:00`, by: C.me().name, change: note, status: 'SCHEDULED', price: price * 100, days, benefits });
    C.audit('新建大会员卡版本', `${P.name} v${v}`, `${at} 生效 · ${note}`);
    C.closeDialog();
    C.render();
    C.toast(`已保存 v${v}，${at} 起对新购生效`);
  };
  C.act.cardCancelVersion = (el) => {
    const v = P.versions.find((x) => x.v === +el.dataset.v);
    if (!v || v.status !== 'SCHEDULED') return;
    v.status = 'CANCELED';
    C.audit('撤销大会员卡版本', `${P.name} v${v.v}`, '生效前撤销');
    C.render();
    C.toast(`已撤销 v${v.v}`);
  };

  /* ---------- 业务会员卡（只读目录） ---------- */
  C.pages.bizcards = {
    title: '业务会员卡',
    render() {
      const holders = C.MEMBERS.flatMap((m) => (m.bizCards || []).map((k) => ({ m, k })));
      const group = ['sx', 'ql', 'zc'].map((b) => {
        const list = C.BIZ_CARD_PRODUCTS.filter((p) => p.b === b);
        return `<section class="panel"><div class="section-title"><h2>${C.BIZ[b].n}</h2><span class="tiny">${list.length ? `${list.length} 种 · 同步于 ${list[0].synced}` : ''}</span></div>
          ${list.length ? `<div class="table-wrap"><table><thead><tr><th>卡名</th><th>类型</th><th class="r">售价</th><th>规格</th><th class="r">持卡人数</th></tr></thead><tbody>
            ${list.map((p) => `<tr><td><strong>${E(p.name)}</strong></td><td>${E(p.type)}</td><td class="r num">${C.yuan(p.price)}</td><td>${E(p.spec)}</td><td class="r num">${C.n(p.holders)}</td></tr>`).join('')}</tbody></table></div>`
            : `<div class="empty"><b>暂无业务会员卡</b>${C.BIZ[b].n}目前只参与 Full愈 大会员卡权益。</div>`}</section>`;
      }).join('');
      return `
        <div class="page-head"><div><h1>业务会员卡</h1><p>各业务线自有会员卡由业务系统开卡、核销、退卡；CRM 只同步基础信息，用于会员 360 展示，不提供任何操作。</p></div><span class="tiny muted">示例卡种 · 接入时以业务系统为准</span></div>
        <div class="stack">${group}
          <section class="panel"><div class="section-title"><h2>样本会员持卡</h2><span class="tiny">点击进入会员 360 · 权益卡</span></div>
            <div class="table-wrap"><table><thead><tr><th>会员</th><th>业务</th><th>卡名</th><th>状态</th><th>有效期</th><th>余量</th></tr></thead><tbody>
            ${holders.map(({ m, k }) => `<tr class="click" data-act="openMemberCard" data-no="${m.no}"><td><strong>${E(m.name)}</strong> <span class="mono tiny muted">${m.no}</span></td><td>${C.biz(k.b)}</td><td>${E(k.name)}</td><td>${C.pill(k.status, k.status === '生效中' ? 'green' : k.status === '即将到期' ? 'amber' : '')}</td><td class="num">${k.valid}</td><td class="num">${E(k.remain)}</td></tr>`).join('')}
            </tbody></table></div></section></div>`;
    }
  };
  C.act.openMemberCard = (el) => C.go(`#/member/${el.dataset.no}/card`);
})();

</script>

  C.AUDIT.sort((a, b) => (a.at < b.at ? 1 : -1));

  /* ---------- 退卡 ---------- */
  const RF_STATUS = { PENDING: ['待审批', 'amber'], APPROVED: ['已批准 · 待锁卡', 'lilac'], LOCKED: ['已锁卡 · 待渠道退款', 'amber'], REFUNDED: ['已退款', 'green'], ABORTED: ['退款失败 · 已解锁', 'red'], REJECTED: ['已驳回', 'red'] };
  const rfPeriod = (r) => C.member(r.no).periods.find((p) => p.card === r.card && p.no === r.pno);
  C.refundFor = (m, p) => C.REFUNDS.find((r) => r.no === m.no && r.card === p.card && r.pno === p.no && !['REJECTED', 'ABORTED'].includes(r.status));
  C.refundStatus = (r) => RF_STATUS[r.status];
  function rfBlock(r) {
    if (r.status !== 'PENDING') return '该退卡单已处理';
    if (!C.can('approve:money')) return '当前角色无审批权限（approve:money）';
    if (r.by.code === C.me().code) return '审批人不能是发起人';
    const m = C.member(r.no);
    const p = rfPeriod(r);
    if (!['ACTIVE', 'PENDING'].includes(p.status)) return `卡期当前为「${C.CARD_STATUS[p.status][0]}」，不能退卡`;
    if (!refundEstimate(m, p).isLast) return '该卡期已不是最后一期，只能先退最后一期';
    return '';
  }
  C.act.rfView = (el) => {
    const r = C.REFUNDS.find((x) => x.id === el.dataset.id);
    const m = C.member(r.no);
    const p = rfPeriod(r);
    const est = refundEstimate(m, p);
    const block = rfBlock(r);
    const sold = C.BIZ[p.sold].n;
    let action = '';
    if (r.status === 'PENDING') {
      action = block ? `<div class="note warn" style="margin-top:12px">${block}</div>` : `
        <div class="form" style="margin-top:14px">
          ${r.quoted !== est.suggested ? `<div class="note warn">申请时建议 ${C.yuan(r.quoted)}，期间有新的权益使用，当前建议 ${C.yuan(est.suggested)}，以当前为准。</div>` : ''}
          <label>批准退款额（元，0 – ${yuanIn(est.suggested)}）<input id="rfAmt" inputmode="decimal" value="${yuanIn(est.suggested)}"></label>
          <label>审批意见（下调或驳回必填）<input id="rfOp" maxlength="60"></label>
          <p id="rfErr" class="tiny err" hidden></p></div>`;
    } else if (r.status === 'APPROVED') {
      action = `<div class="note" style="margin-top:12px">已批准 ${C.yuan(r.approved)}。等待${sold}调用 <span class="mono">refund/lock</span> 锁卡，锁卡后才发起渠道退款。</div>
        <div class="sim"><span class="tiny muted">演示：模拟${sold}后端回调</span><button class="btn" data-act="rfLock" data-id="${r.id}">业务端锁卡</button></div>`;
    } else if (r.status === 'LOCKED') {
      action = `${r.unknown ? `<div class="note bad" style="margin-top:12px">渠道结果未知：${sold}须先向支付渠道查询，再决定 confirm 或 abort；CRM 不自动确认，卡期保持锁定。</div>` : `<div class="note" style="margin-top:12px">卡期已锁定，三端权益停用。等待${sold}渠道退款结果。</div>`}
        <div class="sim"><span class="tiny muted">演示：模拟${sold}后端回调</span>
          <label class="tiny muted">实退（元，≤ ${yuanIn(r.approved)}）<input id="rfDone" inputmode="decimal" value="${yuanIn(r.approved)}" style="width:96px"></label>
          <button class="btn primary" data-act="rfConfirm" data-id="${r.id}">${r.unknown ? '查询为已退款 → confirm' : '退款成功 → confirm'}</button>
          <button class="btn danger" data-act="rfAbort" data-id="${r.id}">${r.unknown ? '查询为未退款 → abort' : '明确失败 → abort'}</button>
          ${r.unknown ? '' : `<button class="btn" data-act="rfUnknown" data-id="${r.id}">结果未知</button>`}</div>
        <p id="rfErr" class="tiny err" hidden></p>`;
    }
    C.dialog(`退卡单 ${r.id}`,
      `<dl class="kv"><dt>会员</dt><dd>${E(m.name)} · <button class="text-btn mono" data-act="rfGoMember" data-no="${m.no}">${m.no} ›</button></dd>
        <dt>卡期</dt><dd><span class="mono">${p.card} · 第 ${p.no} 期</span> ${C.pill(...C.CARD_STATUS[p.status])}</dd>
        <dt>售卖业务</dt><dd>${C.biz(p.sold)} <span class="mono tiny">${p.order}</span> · 实付 ${C.yuan(p.paid)}</dd>
        <dt>测算</dt><dd>支付后第 ${est.day} 天 · 已享优惠 ${C.yuan(est.used)} · ${r.full ? '7 天全额退' : `建议 = ${C.yuan(p.paid)} − ${C.yuan(est.used)} = <b>${C.yuan(est.suggested)}</b>`}</dd>
        <dt>发起</dt><dd>${E(r.by.name)} · ${r.at}<div class="tiny muted">${E(r.channel)} · ${E(r.reason)}</div></dd>
        <dt>状态</dt><dd>${C.pill(...RF_STATUS[r.status])}${r.approver ? `<div class="tiny muted">${E(r.approver)}${r.approved != null ? ` · 批准 ${C.yuan(r.approved)}` : ''}${r.opinion ? ' · ' + E(r.opinion) : ''}${r.refunded != null ? ` · 实退 ${C.yuan(r.refunded)}` : ''}</div>` : ''}</dd></dl>
       ${r.log.length ? `<div class="eyebrow" style="margin:14px 0 6px">过程</div><ul class="steps">${r.log.map((x) => `<li><span class="num tiny muted">${x.at}</span>${E(x.t)}</li>`).join('')}</ul>` : ''}
       ${action}`,
      `<button class="btn" data-act="closeDlg">关闭</button>${r.status === 'PENDING' ? `<button class="btn danger" data-act="rfReject" data-id="${r.id}" ${block ? 'disabled' : ''}>驳回</button><button class="btn primary" data-act="rfApprove" data-id="${r.id}" ${block ? 'disabled' : ''}>批准</button>` : ''}`);
    wide(600);
  };
  C.act.rfGoMember = (el) => { C.closeDialog(); C.go(`#/member/${el.dataset.no}/card`); };
  const rfDone = (r, msg) => { C.closeDialog(); C.render(); C.toast(msg); };
  C.act.rfApprove = (el) => {
    const r = C.REFUNDS.find((x) => x.id === el.dataset.id);
    const block = rfBlock(r);
    if (block) return C.toast(block);
    const est = refundEstimate(C.member(r.no), rfPeriod(r));
    const raw = document.getElementById('rfAmt').value.trim();
    if (!/^\d+(\.\d{1,2})?$/.test(raw)) return err('rfErr', '金额格式：最多两位小数的非负数');
    const cents = Math.round(Number(raw) * 100);
    if (cents > est.suggested) return err('rfErr', `不能超过建议额 ${C.yuan(est.suggested)}（审批只能下调）`);
    const op = document.getElementById('rfOp').value.trim();
    if (cents < est.suggested && !op) return err('rfErr', '下调金额需填写审批意见');
    Object.assign(r, { status: 'APPROVED', approved: cents, approver: whoText(me()), opinion: op, doneAt: C.NOW });
    r.log.push({ at: C.NOW, t: `${whoText(me())} 批准 ${C.yuan(cents)}${cents < est.suggested ? `（建议 ${C.yuan(est.suggested)}，下调）` : ''}` });
    const m = C.member(r.no);
    C.audit('审批通过退卡', `${m.name} · ${m.no}`, `${r.id} 批准 ${C.yuan(cents)} / 建议 ${C.yuan(est.suggested)}${op ? ' · ' + op : ''}`);
    rfDone(r, `${r.id} 已批准 ${C.yuan(cents)}，等待业务端锁卡`);
  };
  C.act.rfReject = (el) => {
    const r = C.REFUNDS.find((x) => x.id === el.dataset.id);
    const block = rfBlock(r);
    if (block) return C.toast(block);
    const op = document.getElementById('rfOp').value.trim();
    if (!op) return err('rfErr', '驳回需填写审批意见');
    Object.assign(r, { status: 'REJECTED', approver: whoText(me()), opinion: op, doneAt: C.NOW });
    r.log.push({ at: C.NOW, t: `${whoText(me())} 驳回：${op}` });
    const m = C.member(r.no);
    C.audit('驳回退卡', `${m.name} · ${m.no}`, `${r.id} · ${op}`);
    rfDone(r, `已驳回 ${r.id}，卡期不变`);
  };
  /* 以下为模拟业务端回调：真实环境由售卖业务后端经签名 API 调用 */
  C.act.rfLock = (el) => {
    const r = C.REFUNDS.find((x) => x.id === el.dataset.id);
    if (r.status !== 'APPROVED') return C.toast('只有已批准的退卡单可以锁卡');
    const p = rfPeriod(r);
    const m = C.member(r.no);
    Object.assign(r, { status: 'LOCKED', prev: p.status });
    p.status = 'REFUND_LOCKED';
    r.log.push({ at: C.NOW, t: '业务端 refund/lock：卡期锁定，三端权益立即停用' });
    sysAudit(API[p.sold], '退卡锁定', `${m.name} · ${m.no}`, `${r.id} · 推送 member.card.changed`);
    m.ver += 1;
    C.emit('member.card.changed', m, `${r.id} 退卡锁定`);
    rfDone(r, '已锁卡 · 三端权益停用');
  };
  C.act.rfUnknown = (el) => {
    const r = C.REFUNDS.find((x) => x.id === el.dataset.id);
    if (r.status !== 'LOCKED') return;
    r.unknown = true;
    r.log.push({ at: C.NOW, t: '渠道退款超时，结果未知：保持锁定，等待业务端查询渠道' });
    sysAudit(API[rfPeriod(r).sold], '退款结果未知', `${C.member(r.no).name} · ${r.no}`, `${r.id} · 未调用 confirm`);
    C.act.rfView(el);
  };
  C.act.rfConfirm = (el) => {
    const r = C.REFUNDS.find((x) => x.id === el.dataset.id);
    if (r.status !== 'LOCKED') return C.toast('只有已锁卡的退卡单可以确认');
    const raw = document.getElementById('rfDone').value.trim();
    if (!/^\d+(\.\d{1,2})?$/.test(raw)) return err('rfErr', '金额格式：最多两位小数的非负数');
    const cents = Math.round(Number(raw) * 100);
    if (cents > r.approved) return err('rfErr', `confirm 被拒：实退不得超过批准额 ${C.yuan(r.approved)}`);
    const p = rfPeriod(r);
    const m = C.member(r.no);
    Object.assign(r, { status: 'REFUNDED', refunded: cents, unknown: false });
    Object.assign(p, { status: 'REFUNDED', refunded: cents });
    r.log.push({ at: C.NOW, t: `业务端 refund/confirm：实退 ${C.yuan(cents)}，卡期已退` });
    const dice = m.dice && !m.dice.guest && cardState(m).key === 'NONE' ? '；未用骰子收回' : '';
    sysAudit(API[p.sold], '退卡完成', `${m.name} · ${m.no}`, `${r.id} 实退 ${C.yuan(cents)}${dice}`);
    m.ver += 1;
    C.emit('member.card.changed', m, `${r.id} 已退款`);
    rfDone(r, `${r.id} 已退款 ${C.yuan(cents)}`);
  };
  C.act.rfAbort = (el) => {
    const r = C.REFUNDS.find((x) => x.id === el.dataset.id);
    if (r.status !== 'LOCKED') return;
    const p = rfPeriod(r);
    const m = C.member(r.no);
    p.status = r.prev || 'ACTIVE';
    Object.assign(r, { status: 'ABORTED', unknown: false });
    r.log.push({ at: C.NOW, t: `业务端 refund/abort：渠道明确未退款，卡期恢复「${C.CARD_STATUS[p.status][0]}」` });
    sysAudit(API[p.sold], '退卡中止', `${m.name} · ${m.no}`, `${r.id} · 解锁`);
    m.ver += 1;
    C.emit('member.card.changed', m, `${r.id} 解锁`);
    rfDone(r, '已解锁，卡期恢复');
  };

  /* ---------- 换绑手机号 ---------- */
  const RB_STATUS = { PENDING: ['待审批', 'amber'], DONE: ['已换绑', 'green'], REJECTED: ['已驳回', 'red'], VOID: ['已失效', ''] };
  const phoneOwner = (ph, self) => C.MEMBERS.find((x) => x.phone === ph && x.no !== self);
  C.pendingRebind = (no) => C.REBINDS.find((x) => x.no === no && x.status === 'PENDING');
  C.act.rebind = (el) => {
    const m = C.member(el.dataset.no);
    if (!C.can('identity:create')) return C.toast('当前角色无 identity:create 权限');
    const pend = C.pendingRebind(m.no);
    if (pend) return C.toast(`已有待审批的换绑单 ${pend.id}`);
    C.dialog(`换绑手机号 · ${E(m.name)}`,
      `<div class="form">
        <div class="note">当前手机号 <b class="num">${m.phone}</b>。换绑需另一位有 approve:identity 权限的同事审批；完成后三端快照随 member.profile.changed 更新。</div>
        <label>新手机号<input id="rbTo" inputmode="numeric" maxlength="11" placeholder="11 位手机号"></label>
        <label>核验方式与原因<textarea id="rbWhy" rows="2" maxlength="80" placeholder="必填：如已核验身份证、回拨新号确认"></textarea></label>
        <p id="rbErr" class="tiny err" hidden></p></div>`,
      `<button class="btn" data-act="closeDlg">取消</button><button class="btn primary" data-act="rebindSubmit" data-no="${m.no}">提交审批</button>`);
  };
  C.act.rebindSubmit = (el) => {
    const m = C.member(el.dataset.no);
    const to = document.getElementById('rbTo').value.trim();
    const why = document.getElementById('rbWhy').value.trim();
    if (!/^1\d{10}$/.test(to)) return err('rbErr', '请输入 11 位手机号');
    if (to === m.phone) return err('rbErr', '新号与当前号相同');
    const owner = phoneOwner(to, m.no);
    if (owner) return err('rbErr', `该号码已属于会员 ${owner.no}，不能直接换绑；如为同一人请走合并流程`);
    if (C.pendingRebind(m.no)) return err('rbErr', '已有待审批的换绑单');
    if (why.length < 4) return err('rbErr', '请填写核验方式与原因（至少 4 个字）');
    const rec = { id: `RB-${C.TODAY.replace(/-/g, '')}-${String(C.REBINDS.length + 1).padStart(4, '0')}`, no: m.no, from: m.phone, to, at: C.NOW, by: me(), reason: why, status: 'PENDING' };
    C.REBINDS.unshift(rec);
    C.audit('发起换绑手机号', `${m.name} · ${m.no}`, `${rec.id} ${C.mask(m.phone)} → ${C.mask(to)}`);
    C.closeDialog();
    C.render();
    C.toast(`已提交 ${rec.id}，待另一人审批`);
  };
  function rbBlock(r) {
    if (r.status !== 'PENDING') return '该换绑单已处理';
    if (!C.can('approve:identity')) return '当前角色无审批权限（approve:identity）';
    if (r.by.code === C.me().code) return '审批人不能是发起人';
    return '';
  }
  C.act.rbView = (el) => {
    const r = C.REBINDS.find((x) => x.id === el.dataset.id);
    const m = C.member(r.no);
    const block = rbBlock(r);
    const owner = phoneOwner(r.to, r.no);
    C.dialog(`换绑单 ${r.id}`,
      `<dl class="kv"><dt>会员</dt><dd>${E(m.name)} · <span class="mono">${m.no}</span></dd>
        <dt>手机号</dt><dd class="num">${r.from} → <b>${r.to}</b></dd>
        <dt>发起</dt><dd>${E(r.by.name)}（${r.by.code}）· ${r.at}<div class="tiny muted">${E(r.reason)}</div></dd>
        <dt>状态</dt><dd>${C.pill(...RB_STATUS[r.status])}${r.approver ? `<div class="tiny muted">${E(r.approver)} · ${r.doneAt}${r.opinion ? ' · ' + E(r.opinion) : ''}</div>` : ''}</dd></dl>
       ${r.status === 'PENDING' ? `${owner ? `<div class="note bad" style="margin-top:12px">新号已被会员 ${owner.no} 占用，整单不执行；请驳回后走合并流程。</div>` : ''}
         ${block ? `<div class="note warn" style="margin-top:12px">${block}</div>` : `<label class="small muted" style="display:block;margin-top:12px">审批意见（驳回必填）<input id="rbOp" maxlength="60" style="display:block;width:100%;margin-top:6px"></label><p id="rbErr" class="tiny err" hidden></p>`}` : ''}`,
      `<button class="btn" data-act="closeDlg">关闭</button>${r.status === 'PENDING' ? `<button class="btn danger" data-act="rbReject" data-id="${r.id}" ${block ? 'disabled' : ''}>驳回</button><button class="btn primary" data-act="rbApprove" data-id="${r.id}" ${block || owner ? 'disabled' : ''}>通过并换绑</button>` : ''}`);
    wide(540);
  };
  C.act.rbApprove = (el) => {
    const r = C.REBINDS.find((x) => x.id === el.dataset.id);
    const block = rbBlock(r);
    if (block) return C.toast(block);
    const m = C.member(r.no);
    if (phoneOwner(r.to, r.no)) return err('rbErr', '新号已被占用，整单不执行');
    if (m.phone !== r.from) return err('rbErr', '会员手机号已变化，本单失效，请重新发起');
    m.phone = r.to;
    m.ver += 1;
    C.emit('member.profile.changed', m, `${r.id} 换绑手机号`);
    Object.assign(r, { status: 'DONE', approver: whoText(me()), doneAt: C.NOW, opinion: (document.getElementById('rbOp') || {}).value || '' });
    C.audit('审批通过换绑', `${m.name} · ${m.no}`, `${r.id} ${C.mask(r.from)} → ${C.mask(r.to)} · 资料 v${m.ver}`);
    C.closeDialog();
    C.render();
    const behind = Object.entries(m.snap).filter(([, s]) => s.stale).map(([b]) => C.BIZ[b].n);
    C.toast(`已换绑 · 广播 member.profile.changed${behind.length ? `，${behind.join('、')}待补投` : ''}`);
  };
  C.act.rbReject = (el) => {
    const r = C.REBINDS.find((x) => x.id === el.dataset.id);
    const block = rbBlock(r);
    if (block) return C.toast(block);
    const op = document.getElementById('rbOp').value.trim();
    if (!op) return err('rbErr', '驳回需填写审批意见');
    Object.assign(r, { status: 'REJECTED', approver: whoText(me()), doneAt: C.NOW, opinion: op });
    C.audit('驳回换绑', `${C.member(r.no).name} · ${r.no}`, `${r.id} · ${op}`);
    C.closeDialog();
    C.render();
    C.toast(`已驳回 ${r.id}`);
  };

  /* ---------- 导出：默认脱敏；明文需审批，仅发起人下载一次 ---------- */
  const EX_STATUS = { PENDING: ['待审批', 'amber'], APPROVED: ['已批准 · 待下载', 'lilac'], USED: ['已下载', 'green'], REJECTED: ['已驳回', 'red'] };
  function csv(list, plain) {
    const head = ['会员号', '姓名', '称呼', '手机号', '来过的业务', '大会员卡', '积分'];
    const card = (m) => { const k = cardState(m).key; return k === 'NONE' ? '未开通' : C.CARD_STATUS[k][0]; };
    const rows = list.map((m) => [m.no, m.name, m.call || '', plain ? m.phone : C.mask(m.phone), m.biz.map((b) => C.BIZ[b].n).join('/'), card(m), C.calc.balance(m)]);
    return '\ufeff' + [head, ...rows].map((r) => r.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
  }
  function download(name, text) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv;charset=utf-8' }));
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0);
  }
  C.lastExport = null;
  const scopeText = () => {
    const L = C.state.list;
    const parts = [];
    if (L.q) parts.push(`关键词「${L.q}」`);
    if (L.biz !== 'all') parts.push(C.BIZ[L.biz].n);
    if (L.card !== 'all') parts.push(L.card === 'NONE' ? '未开通' : C.CARD_STATUS[L.card][0]);
    if (L.seg && L.seg !== 'all') parts.push(`人群：${C.SEGMENT_NAME(L.seg)}`);
    return parts.length ? parts.join(' · ') : '全部会员';
  };
  C.act.exportMasked = () => {
    const list = C.memberFiltered();
    if (!list.length) return C.toast('当前筛选没有会员，无需导出');
    const text = csv(list, false);
    C.lastExport = text;
    download(`crm-members-masked-${C.TODAY.replace(/-/g, '')}.csv`, text);
    C.audit('导出会员（脱敏）', `${scopeText()} · ${list.length} 人`, '手机号 前 3 后 4');
    C.toast(`已导出 ${list.length} 人 · 手机号脱敏`);
  };
  C.act.exportPlainReq = () => {
    const list = C.memberFiltered();
    if (!list.length) return C.toast('当前筛选没有会员');
    C.dialog('申请明文导出',
      `<div class="form"><div class="note warn">明文导出是否允许仍待经营决策；demo 按「需审批、仅发起人下载一次」演示。</div>
        <dl class="kv"><dt>范围</dt><dd>${E(scopeText())} · <b>${list.length}</b> 人</dd><dt>字段</dt><dd>会员号、姓名、称呼、完整手机号、业务、卡状态、积分</dd></dl>
        <label>用途与保管期限<textarea id="exWhy" rows="2" maxlength="80" placeholder="必填：如短信平台导入，48 小时内删除"></textarea></label>
        <p id="exErr" class="tiny err" hidden></p></div>`,
      `<button class="btn" data-act="closeDlg">取消</button><button class="btn primary" data-act="exportPlainSubmit">提交审批</button>`);
  };
  C.act.exportPlainSubmit = () => {
    const why = document.getElementById('exWhy').value.trim();
    if (why.length < 4) return err('exErr', '请填写用途与保管期限（至少 4 个字）');
    const list = C.memberFiltered();
    const rec = { id: `EX-${C.TODAY.replace(/-/g, '')}-${String(C.EXPORTS.length + 1).padStart(4, '0')}`, at: C.NOW, by: me(), scope: scopeText(), nos: list.map((m) => m.no), purpose: why, status: 'PENDING' };
    C.EXPORTS.unshift(rec);
    C.audit('申请明文导出', `${rec.scope} · ${rec.nos.length} 人`, rec.id);
    C.closeDialog();
    C.render();
    C.toast(`已提交 ${rec.id}，待另一人审批`);
  };
  function exBlock(r) {
    if (r.status !== 'PENDING') return '该导出单已处理';
    if (!C.can('approve:identity')) return '当前角色无审批权限（approve:identity）';
    if (r.by.code === C.me().code) return '审批人不能是发起人';
    return '';
  }
  C.act.exView = (el) => {
    const r = C.EXPORTS.find((x) => x.id === el.dataset.id);
    const block = exBlock(r);
    const mine = r.by.code === C.me().code;
    C.dialog(`明文导出 ${r.id}`,
      `<dl class="kv"><dt>范围</dt><dd>${E(r.scope)} · ${r.nos.length} 人</dd><dt>用途</dt><dd>${E(r.purpose)}</dd>
        <dt>发起</dt><dd>${E(r.by.name)}（${r.by.code}）· ${r.at}</dd>
        <dt>状态</dt><dd>${C.pill(...EX_STATUS[r.status])}${r.approver ? `<div class="tiny muted">${E(r.approver)} · ${r.doneAt}${r.opinion ? ' · ' + E(r.opinion) : ''}</div>` : ''}${r.usedAt ? `<div class="tiny muted">下载于 ${r.usedAt}</div>` : ''}</dd></dl>
       ${r.status === 'PENDING' ? (block ? `<div class="note warn" style="margin-top:12px">${block}</div>` : `<label class="small muted" style="display:block;margin-top:12px">审批意见（驳回必填）<input id="exOp" maxlength="60" style="display:block;width:100%;margin-top:6px"></label><p id="exErr" class="tiny err" hidden></p>`) : ''}
       ${r.status === 'APPROVED' ? `<div class="note ${mine ? 'ok' : ''}" style="margin-top:12px">${mine ? '批准后仅可下载一次，下载即记审计。' : `仅发起人 ${E(r.by.name)} 可下载。`}</div>` : ''}`,
      `<button class="btn" data-act="closeDlg">关闭</button>${r.status === 'PENDING' ? `<button class="btn danger" data-act="exReject" data-id="${r.id}" ${block ? 'disabled' : ''}>驳回</button><button class="btn primary" data-act="exApprove" data-id="${r.id}" ${block ? 'disabled' : ''}>批准</button>` : ''}${r.status === 'APPROVED' && mine ? `<button class="btn primary" data-act="exDownload" data-id="${r.id}">下载明文 CSV</button>` : ''}`);
    wide(540);
  };
  C.act.exApprove = (el) => {
    const r = C.EXPORTS.find((x) => x.id === el.dataset.id);
    const block = exBlock(r);
    if (block) return C.toast(block);
    Object.assign(r, { status: 'APPROVED', approver: whoText(me()), doneAt: C.NOW, opinion: document.getElementById('exOp').value.trim() });
    C.audit('审批通过明文导出', `${r.scope} · ${r.nos.length} 人`, `${r.id} · 发起人 ${r.by.name}`);
    C.closeDialog();
    C.render();
    C.toast(`${r.id} 已批准，发起人可下载一次`);
  };
  C.act.exReject = (el) => {
    const r = C.EXPORTS.find((x) => x.id === el.dataset.id);
    const block = exBlock(r);
    if (block) return C.toast(block);
    const op = document.getElementById('exOp').value.trim();
    if (!op) return err('exErr', '驳回需填写审批意见');
    Object.assign(r, { status: 'REJECTED', approver: whoText(me()), doneAt: C.NOW, opinion: op });
    C.audit('驳回明文导出', r.scope, `${r.id} · ${op}`);
    C.closeDialog();
    C.render();
    C.toast(`已驳回 ${r.id}`);
  };
  C.act.exDownload = (el) => {
    const r = C.EXPORTS.find((x) => x.id === el.dataset.id);
    if (r.status !== 'APPROVED') return C.toast('该导出单不可下载');
    if (r.by.code !== C.me().code) return C.toast('仅发起人可下载');
    const text = csv(r.nos.map(C.member), true);
    C.lastExport = text;
    download(`crm-members-plain-${r.id}.csv`, text);
    Object.assign(r, { status: 'USED', usedAt: C.NOW });
    C.audit('下载明文导出', `${r.scope} · ${r.nos.length} 人`, `${r.id} · 含完整手机号`);
    C.closeDialog();
    C.render();
    C.toast('已下载 · 该单不可再次下载');
  };

  /* ---------- 审批中心 ---------- */
  const ADJ_STATUS = { PENDING: ['待审批', 'amber'], DONE: ['已入账', 'green'], REJECTED: ['已驳回', 'red'] };
  const mName = (no) => { const m = C.member(no); return `${E(m.name)}<div class="mono tiny muted">${m.no}</div>`; };
  function items() {
    const rf = C.REFUNDS.map((r) => { const p = rfPeriod(r); return {
      id: r.id, type: 'refund', label: '退卡', who: r.by, at: r.at, st: RF_STATUS[r.status], act: 'rfView', block: r.status === 'PENDING' ? rfBlock(r) : 'x',
      phase: r.status === 'PENDING' ? 'pending' : ['APPROVED', 'LOCKED'].includes(r.status) ? 'open' : 'done',
      member: mName(r.no), sum: `${C.biz(p.sold)} ${r.full ? `7 天全额 ${C.yuan(p.paid)}` : r.approved != null ? `批准 ${C.yuan(r.approved)}` : `建议 ${C.yuan(refundEstimate(C.member(r.no), p).suggested)}`}` }; });
    const rb = C.REBINDS.map((r) => ({
      id: r.id, type: 'rebind', label: '换绑手机号', who: r.by, at: r.at, st: RB_STATUS[r.status], act: 'rbView', block: r.status === 'PENDING' ? rbBlock(r) : 'x',
      phase: r.status === 'PENDING' ? 'pending' : 'done', member: mName(r.no), sum: `<span class="num">${C.mask(r.from)} → ${C.mask(r.to)}</span>` }));
    const adj = C.ADJUSTS.map((a) => ({
      id: a.id, type: 'adjust', label: '积分调整', who: a.by, at: a.at, st: ADJ_STATUS[a.status], act: 'adjView',
      block: a.status !== 'PENDING' ? 'x' : !C.can('approve:money') ? 'p' : a.by.code === C.me().code ? 's' : '',
      phase: a.status === 'PENDING' ? 'pending' : 'done',
      member: a.lines.length === 1 ? mName(a.lines[0].no) : `${E(C.member(a.lines[0].no).name)} 等 ${a.lines.length} 人`,
      sum: `${a.kind === 'batch' ? '批量' : '单笔'} ${a.lines.reduce((s, l) => s + l.delta, 0) > 0 ? '+' : ''}${C.n(a.lines.reduce((s, l) => s + l.delta, 0))} 分 · ${E(a.reason)}` }));
    const ex = C.EXPORTS.map((r) => ({
      id: r.id, type: 'export', label: '明文导出', who: r.by, at: r.at, st: EX_STATUS[r.status], act: 'exView', block: r.status === 'PENDING' ? exBlock(r) : 'x',
      phase: r.status === 'PENDING' ? 'pending' : r.status === 'APPROVED' ? 'open' : 'done', member: `${r.nos.length} 人`, sum: E(r.scope) }));
    return [...rf, ...rb, ...adj, ...ex].sort((a, b) => (a.at < b.at ? 1 : -1));
  }
  C.pendingApprovals = () => items().filter((i) => i.phase === 'pending').length;
  C.pendingOf = (type) => items().filter((i) => i.phase === 'pending' && i.type === type).length;
  const TYPES = [['all', '全部'], ['refund', '退卡'], ['rebind', '换绑手机号'], ['adjust', '积分调整'], ['export', '明文导出']];
  const view = { phase: 'pending' };
  C.act.apPhase = (el) => { view.phase = el.dataset.v; C.render(); };
  C.pages.approvals = {
    title: '审批中心',
    render([type = 'all']) {
      const all = items();
      const ofType = all.filter((i) => type === 'all' || i.type === type);
      const list = ofType.filter((i) => view.phase === 'all' || i.phase === view.phase);
      const count = (ph) => ofType.filter((i) => i.phase === ph).length;
      const chip = (v, t) => `<button class="chip ${view.phase === v ? 'active' : ''}" data-act="apPhase" data-v="${v}">${t}</button>`;
      const tab = ([k, t]) => { const n = all.filter((i) => i.phase === 'pending' && (k === 'all' || i.type === k)).length; return `<button class="tab ${type === k ? 'active' : ''}" role="tab" aria-selected="${type === k}" data-act="nav" data-key="approvals${k === 'all' ? '' : '/' + k}">${t}${n ? ` <span class="badge">${n}</span>` : ''}</button>`; };
      const actText = (i) => i.phase === 'pending' && !i.block ? '审批 ›' : '查看 ›';
      return `
        <div class="page-head"><div><h1>审批中心</h1><p>退卡、换绑手机号、积分调整、明文导出的审批汇总。审批人不能是发起人；审批时按当时数据重新校验，不满足则整单不执行。</p></div>
          <span class="tiny muted">当前身份 ${C.me().code}：${[C.can('approve:money') ? '可审批退卡与积分调整' : '', C.can('approve:identity') ? '可审批换绑与明文导出' : ''].filter(Boolean).join('、') || '无审批权限，仅查看'}</span></div>
        <div class="tabs" role="tablist">${TYPES.map(tab).join('')}</div>
        <div class="table-tools"><div class="chips">${chip('pending', `待审批 ${count('pending')}`)}${chip('open', `进行中 ${count('open')}`)}${chip('done', '已完结')}${chip('all', '全部')}</div>
          <span class="tiny muted" style="margin-left:auto">「进行中」= 已批准、等待业务端锁卡退款或发起人下载</span></div>
        <div class="table-wrap"><table><thead><tr><th>单号</th><th>类型</th><th>会员</th><th>摘要</th><th>发起人</th><th>发起时间</th><th>状态</th><th></th></tr></thead><tbody>
        ${list.length ? list.map((i) => `<tr class="click" data-act="${i.act}" data-id="${i.id}"><td class="mono">${i.id}</td><td>${i.label}</td><td>${i.member}</td><td class="wrap">${i.sum}</td>
          <td>${E(i.who.name)}<div class="tiny muted">${i.who.code}</div></td><td class="num">${i.at}</td><td>${C.pill(...i.st)}</td><td><button class="text-btn">${actText(i)}</button></td></tr>`).join('')
          : `<tr><td colspan="8"><div class="empty"><b>${view.phase === 'pending' ? '没有待审批的单据' : '没有单据'}</b>换个类型或状态看看。</div></td></tr>`}
        </tbody></table></div>
        <p class="tiny muted" style="margin-top:10px">退卡单由售卖业务经 refund-quote 发起（7 天内且未使用权益的全额退无需审批）；换绑只能由客服在会员档案发起；明文导出从会员查询申请。</p>`;
    }
  };

  /* ---------- 审计日志 ---------- */
  const af = { act: 'all', who: 'all', q: '' };
  function auditRows() {
    const q = af.q.trim();
    const list = C.AUDIT.filter((a) => (af.act === 'all' || a.act === af.act) && (af.who === 'all' || a.who === af.who) && (!q || (a.obj + a.detail).includes(q)));
    if (!list.length) return '<tr><td colspan="5"><div class="empty"><b>没有匹配的记录</b>换个筛选条件。</div></td></tr>';
    return list.map((a) => `<tr><td class="num">${a.at}</td><td>${E(a.who)}</td><td>${C.pill(a.act, /驳回|中止|未知/.test(a.act) ? 'red' : /明文|查看/.test(a.act) ? 'amber' : '')}</td><td>${E(a.obj)}</td><td class="wrap small muted">${E(a.detail) || '—'}</td></tr>`).join('');
  }
  C.input.auditAct = (el) => { af.act = el.value; C.pages.audit.refresh(); };
  C.input.auditWho = (el) => { af.who = el.value; C.pages.audit.refresh(); };
  C.input.auditQ = (el) => { af.q = el.value; C.pages.audit.refresh(); };
  C.pages.audit = {
    title: '审计日志',
    refresh() { const tb = document.getElementById('auditRows'); if (tb) tb.innerHTML = auditRows(); },
    render() {
      if (!C.can('audit:view')) return `<div class="page-head"><div><h1>审计日志</h1></div></div><section class="panel"><div class="empty"><b>当前角色无查看权限</b>需要 audit:view（会员运营 / 财务 / 管理员）。你的操作仍会被完整记录。</div></section>`;
      const opt = (v, t, cur) => `<option value="${E(v)}" ${cur === v ? 'selected' : ''}>${E(t)}</option>`;
      const acts = [...new Set(C.AUDIT.map((a) => a.act))];
      const whos = [...new Set(C.AUDIT.map((a) => a.who))];
      return `
        <div class="page-head"><div><h1>审计日志</h1><p>只追加，不提供编辑与删除。覆盖查看会员档案、资料修改、积分调整、退卡、换绑、导出、配置变更与审批；业务端回调记录调用方。</p></div><span class="tiny muted">共 ${C.AUDIT.length} 条（演示内存数据，刷新页面重置）</span></div>
        <div class="table-tools">
          <select data-input="auditAct" aria-label="动作">${opt('all', '全部动作', af.act)}${acts.map((a) => opt(a, a, af.act)).join('')}</select>
          <select data-input="auditWho" aria-label="操作人">${opt('all', '全部操作人', af.who)}${whos.map((w) => opt(w, w, af.who)).join('')}</select>
          <input type="search" placeholder="对象或详情关键词，如会员号、单号" aria-label="审计关键词" data-input="auditQ" value="${E(af.q)}">
        </div>
        <div class="table-wrap"><table><thead><tr><th>时间</th><th>操作人</th><th>动作</th><th>对象</th><th>详情</th></tr></thead><tbody id="auditRows">${auditRows()}</tbody></table></div>`;
    }
  };

  /* 侧栏徽标 */
  C.NAV.forEach((n) => (n.items || []).forEach((i) => { if (i.key === 'approvals') i.badge = C.pendingApprovals; }));
})();

</script>
<script>/* ==== page-sync.js ==== */
/* Full愈 CRM demo · 三端同步（outbox 事件、webhook 投递与重投、快照落后）
 * 设计 §3：CRM 写操作与 outbox_event 同事务提交，异步投递；业务端返回 2xx 即成功，
 *   失败按 1/5/30 分钟、2/6/12/24 小时退避；超过 24 小时转人工队列。消费端只接受比本地快照更新的版本。
 * CRM.emit(type, 会员) 供其他页面调用：按会员已有快照的业务逐一投递；接收端故障时快照标记为落后。
 */
(function () {
  const C = window.CRM;
  const E = C.esc;
  const sysAudit = (who, act, obj, detail) => C.AUDIT.unshift({ at: C.NOW, who, act, obj, detail: detail || '' });
  const BACKOFF = [1, 5, 30, 120, 360, 720, 1440];
  const hm = (t) => t.slice(11, 16);
  const plus = (at, min) => { const d = new Date(at.replace(' ', 'T')); d.setMinutes(d.getMinutes() + min); const p = (x) => String(x).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };

  /* ---------- 接收端（合成）：密钥只存引用，后台不显示 ---------- */
  C.SYNC = {
    sx: { url: 'https://sx.crm-test.example/crm/webhook', key: 'sx-k2', ip: '203.0.113.21', last: '15:29:41', down: false },
    ql: { url: 'https://ql.crm-test.example/fully/crm/webhook', key: 'ql-k1', ip: '203.0.113.34', last: '15:29:12', down: false },
    zc: { url: 'https://zc.crm-test.example/api/crm/webhook', key: 'zc-k1', ip: '203.0.113.57', last: '14:58:03', down: true, error: 'HTTP 503 Service Unavailable' }
  };
  C.EVENT_TYPE = {
    'member.profile.changed': '资料变更', 'member.card.changed': '大会员卡变更', 'points.changed': '积分变更',
    'member.merged': '会员合并', 'notify.requested': '提醒请求'
  };
  const SNAPSHOT_TYPES = ['member.profile.changed', 'member.card.changed', 'points.changed', 'member.merged'];
  const EV_STATUS = { DELIVERED: ['已送达', 'green'], DELIVERING: ['投递中', 'lilac'], FAILED: ['失败 · 待重试', 'red'] };

  C.OUTBOX = [
    { id: 'EV-10233', type: 'member.card.changed', biz: 'ql', no: 'FY-2607-001204', ver: 4, at: '2026-11-07 15:29', attempts: 1, status: 'DELIVERING', resp: '等待响应（超时 10 秒）' },
    { id: 'EV-10232', type: 'points.changed', biz: 'ql', no: 'FY-2605-000927', ver: 2, at: '2026-11-07 15:29', attempts: 1, status: 'DELIVERING', resp: '等待响应（超时 10 秒）' },
    { id: 'EV-10231', type: 'member.profile.changed', biz: 'sx', no: 'FY-2602-008812', ver: 7, at: '2026-11-07 15:29', attempts: 1, status: 'DELIVERED', resp: '200', done: '2026-11-07 15:29' },
    { id: 'EV-10230', type: 'member.profile.changed', biz: 'ql', no: 'FY-2602-008812', ver: 7, at: '2026-11-07 15:29', attempts: 1, status: 'DELIVERED', resp: '200', done: '2026-11-07 15:29' },
    { id: 'EV-10229', type: 'notify.requested', biz: 'zc', no: 'FY-2503-000431', ver: 3, at: '2026-11-07 15:10', attempts: 2, status: 'FAILED', resp: 'HTTP 503', next: '2026-11-07 15:16', note: '大会员卡到期回访提醒' },
    { id: 'EV-10228', type: 'notify.requested', biz: 'zc', no: 'FY-2602-008812', ver: 7, at: '2026-11-07 15:02', attempts: 3, status: 'FAILED', resp: 'HTTP 503', next: '2026-11-07 15:38', note: '积分 1/1 过期前 30 天提醒' },
    { id: 'EV-10226', type: 'member.profile.changed', biz: 'zc', no: 'FY-2512-000012', ver: 5, at: '2026-11-07 14:58', attempts: 3, status: 'FAILED', resp: 'HTTP 503', next: '2026-11-07 15:34', note: '生日与城市更新' },
    { id: 'EV-10225', type: 'member.profile.changed', biz: 'sx', no: 'FY-2512-000012', ver: 5, at: '2026-11-07 14:58', attempts: 1, status: 'DELIVERED', resp: '200', done: '2026-11-07 14:58' },
    { id: 'EV-10221', type: 'member.profile.changed', biz: 'sx', no: 'FY-2512-000012', ver: 4, at: '2026-11-06 18:40', attempts: 2, status: 'DELIVERED', resp: '200 · 本地已是 v5，旧版本忽略', done: '2026-11-07 14:59', note: '乱序到达' },
    { id: 'EV-10219', type: 'member.card.changed', biz: 'zc', no: 'FY-2512-000012', ver: 4, at: '2026-11-06 18:44', attempts: 1, status: 'DELIVERED', resp: '200', done: '2026-11-06 18:44', note: '续费第 2 期待生效' },
    { id: 'EV-10218', type: 'member.card.changed', biz: 'sx', no: 'FY-2512-000012', ver: 4, at: '2026-11-06 18:44', attempts: 1, status: 'DELIVERED', resp: '200', done: '2026-11-06 18:44', note: '续费第 2 期待生效' },
    { id: 'EV-10204', type: 'points.changed', biz: 'zc', no: 'FY-2602-008812', ver: 7, at: '2026-11-04 09:48', attempts: 1, status: 'DELIVERED', resp: '200', done: '2026-11-04 09:48' }
  ];
  let seq = 10234;

  /* 投递一条事件：成功则推进该业务的会员快照；旧版本由消费端忽略 */
  function deliver(ev) {
    const m = C.member(ev.no);
    const s = m && m.snap[ev.biz];
    ev.attempts += 1;
    ev.status = 'DELIVERED';
    ev.done = C.NOW;
    ev.next = null;
    if (s && SNAPSHOT_TYPES.includes(ev.type) && s.ver > ev.ver) ev.resp = `200 · 本地已是 v${s.ver}，旧版本忽略`;
    else {
      ev.resp = '200';
      if (s && SNAPSHOT_TYPES.includes(ev.type)) { s.ver = Math.max(s.ver, m.ver); s.at = hm(C.NOW); }
    }
    if (s) s.stale = C.OUTBOX.some((x) => x.no === ev.no && x.biz === ev.biz && x.status === 'FAILED' && SNAPSHOT_TYPES.includes(x.type));
    C.SYNC[ev.biz].last = `${hm(C.NOW)}:00`;
  }
  function fail(ev) {
    ev.attempts += 1;
    ev.status = 'FAILED';
    ev.resp = C.SYNC[ev.biz].error.replace(' Service Unavailable', '');
    ev.next = plus(C.NOW, BACKOFF[Math.min(ev.attempts - 1, BACKOFF.length - 1)]);
  }

  /* 供其他页面调用：写 outbox 并立即尝试投递（真实系统为异步，这里同步模拟） */
  C.emit = (type, m, note) => {
    Object.keys(m.snap).forEach((b) => {
      const ev = { id: `EV-${seq++}`, type, biz: b, no: m.no, ver: m.ver, at: C.NOW, attempts: 0, note: note || '' };
      C.OUTBOX.unshift(ev);
      if (C.SYNC[b].down) { fail(ev); if (SNAPSHOT_TYPES.includes(type)) m.snap[b].stale = true; } else deliver(ev);
    });
    return Object.keys(m.snap).filter((b) => m.snap[b].stale).map((b) => C.BIZ[b].n);
  };

  const failed = (b) => C.OUTBOX.filter((e) => e.biz === b && e.status === 'FAILED');
  const inflight = (b) => C.OUTBOX.filter((e) => e.biz === b && e.status === 'DELIVERING');
  const nextOf = (b) => { const n = failed(b).map((e) => e.next).sort()[0]; return n ? hm(n) : '—'; };
  /* 工作台「三端同步」由事件实时汇总 */
  Object.defineProperty(C.SUMMARY, 'sync', {
    get() {
      return Object.fromEntries(Object.keys(C.SYNC).map((b) => {
        const f = failed(b).length;
        const d = inflight(b).length;
        return [b, { ok: !f, pending: f + d, last: C.SYNC[b].last, note: f ? `${C.SYNC[b].error.replace(' Service Unavailable', '')} · 下次重试 ${nextOf(b)}` : d ? `${d} 条投递中` : '快照平均 1 分钟内' }];
      }));
    }
  });

  /* ---------- 动作 ---------- */
  C.act.syncRetry = (el) => {
    if (!C.can('sync:retry')) return C.toast('当前角色无 sync:retry 权限');
    const b = el.dataset.biz;
    const list = (el.dataset.id ? C.OUTBOX.filter((e) => e.id === el.dataset.id) : failed(b)).filter((e) => e.status === 'FAILED').sort((x, y) => (x.ver - y.ver) || (x.at < y.at ? -1 : 1));
    if (!list.length) return C.toast('没有待重投的事件');
    const S = C.SYNC[b];
    if (S.down) {
      list.forEach(fail);
      C.audit('手动重投 webhook', `${C.BIZ[b].n} · ${list.length} 条`, `仍返回 ${S.error}；下次自动重试 ${nextOf(b)}`);
      C.render();
      return C.toast(`${C.BIZ[b].n}仍返回 ${S.error.slice(5, 8)}，${list.length} 条保持积压`);
    }
    const before = list.map((e) => { const m = C.member(e.no); return m.snap[b] ? `${m.name} v${m.snap[b].ver}` : ''; });
    list.forEach(deliver);
    const moved = list.map((e, i) => { const m = C.member(e.no); return m.snap[b] && SNAPSHOT_TYPES.includes(e.type) ? `${before[i]} → v${m.snap[b].ver}` : ''; }).filter(Boolean);
    C.audit('手动重投 webhook', `${C.BIZ[b].n} · ${list.length} 条`, `全部送达${moved.length ? '；快照 ' + moved.join('、') : ''}`);
    C.render();
    C.toast(`已送达 ${list.length} 条，${C.BIZ[b].n}快照已追平`);
  };
  /* 演示开关：模拟业务接收端故障 / 恢复（真实环境是外部状态，不在 CRM 操作） */
  C.act.syncToggle = (el) => {
    const S = C.SYNC[el.dataset.biz];
    S.down = !S.down;
    if (S.down) S.error = 'HTTP 503 Service Unavailable';
    C.render();
    C.toast(S.down ? `演示：${C.BIZ[el.dataset.biz].n}接收端故障` : `演示：${C.BIZ[el.dataset.biz].n}接收端已恢复，积压事件需重投或等待自动重试`);
  };
  /* 演示：投递中的事件收到响应 */
  C.act.syncAck = (el) => {
    const list = inflight(el.dataset.biz);
    list.forEach((e) => { e.attempts -= 1; deliver(e); });
    C.render();
    C.toast(`演示：${list.length} 条收到 200`);
  };

  /* ---------- 页面 ---------- */
  const view = { biz: 'all', status: 'all' };
  C.act.syncBiz = (el) => { view.biz = el.dataset.v; C.render(); };
  C.input.syncStatus = (el) => { view.status = el.value; C.render(); };

  function bizCard(b) {
    const S = C.SYNC[b];
    const f = failed(b);
    const d = inflight(b);
    const can = C.can('sync:retry');
    const state = f.length ? C.pill(`投递失败 · 积压 ${f.length}`, 'red') : d.length ? C.pill(`正常 · 投递中 ${d.length}`, 'green') : C.pill('正常', 'green');
    return `<section class="panel"><div class="section-title"><h2>${C.biz(b)}</h2>${state}</div>
      <dl class="kv">
        <dt>回调地址</dt><dd class="mono tiny" style="word-break:break-all">${E(S.url)}</dd>
        <dt>签名</dt><dd class="tiny">HMAC-SHA256 · key_id <span class="mono">${S.key}</span><div class="muted">密钥存于密钥管理服务，后台只显示引用</div></dd>
        <dt>出口 IP 白名单</dt><dd class="mono tiny">${S.ip}</dd>
        <dt>最近送达</dt><dd class="num">${S.last}</dd>
        <dt>接收端</dt><dd>${S.down ? `<span style="color:var(--danger)">${E(S.error)}</span>` : '<span class="muted">返回 2xx</span>'}</dd>
        ${f.length ? `<dt>下次自动重试</dt><dd class="num">${nextOf(b)}</dd>` : ''}
      </dl>
      ${f.length ? `<div class="table-tools" style="margin:12px 0 0"><button class="btn primary" data-act="syncRetry" data-biz="${b}" ${can ? '' : 'disabled title="当前角色无 sync:retry 权限"'}>立即重投 ${f.length} 条</button><span class="tiny muted">按版本从旧到新投递</span></div>` : ''}
      <div class="sim"><span class="tiny muted">演示：模拟${C.BIZ[b].n}接收端状态（外部系统，不在 CRM 操作）</span>
        <button class="btn" data-act="syncToggle" data-biz="${b}">${S.down ? '接收端恢复' : '接收端故障'}</button>
        ${d.length ? `<button class="btn" data-act="syncAck" data-biz="${b}">投递中的 ${d.length} 条返回 200</button>` : ''}</div>
    </section>`;
  }
  function staleList() {
    const rows = [];
    C.MEMBERS.filter((m) => m.status !== 'MERGED').forEach((m) => Object.entries(m.snap).forEach(([b, s]) => {
      if (s.stale || s.ver < m.ver) rows.push(`<tr class="click" data-act="openMember" data-no="${m.no}"><td><strong>${E(m.name)}</strong><div class="tiny muted mono">${m.no}</div></td><td>${C.biz(b)}</td><td class="num">v${s.ver} · ${s.at}</td><td class="num">v${m.ver}</td><td>${C.pill(s.ver < m.ver ? `落后 ${m.ver - s.ver} 版` : '有未送达事件', 'red')}</td></tr>`);
    }));
    return rows.length ? `<div class="table-wrap"><table><thead><tr><th>会员</th><th>业务</th><th>业务端快照</th><th>CRM 当前</th><th>状态</th></tr></thead><tbody>${rows.join('')}</tbody></table></div>`
      : '<div class="check ok">三端快照均与 CRM 一致</div>';
  }
  function eventRows() {
    const list = C.OUTBOX.filter((e) => (view.biz === 'all' || e.biz === view.biz) && (view.status === 'all' || e.status === view.status));
    if (!list.length) return '<tr><td colspan="9"><div class="empty"><b>没有匹配的事件</b>换个业务或状态看看。</div></td></tr>';
    const can = C.can('sync:retry');
    return list.map((e) => {
      const m = C.member(e.no);
      return `<tr><td class="mono">${e.id}</td><td>${C.EVENT_TYPE[e.type]}<div class="tiny muted mono">${e.type}</div></td><td>${C.biz(e.biz)}</td>
        <td>${m ? E(m.name) : '—'}<div class="tiny muted mono">${e.no}</div></td><td class="num">v${e.ver}</td><td>${C.pill(...EV_STATUS[e.status])}</td>
        <td class="num">${e.attempts} 次<div class="tiny muted">${e.status === 'FAILED' ? `下次 ${hm(e.next)}` : e.done ? `送达 ${e.done.slice(5)}` : '—'}</div></td>
        <td class="wrap tiny">${E(e.resp)}${e.note ? `<div class="muted">${E(e.note)}</div>` : ''}</td>
        <td>${e.status === 'FAILED' ? `<button class="text-btn" data-act="syncRetry" data-biz="${e.biz}" data-id="${e.id}" ${can ? '' : 'disabled title="当前角色无 sync:retry 权限"'}>重投</button>` : ''}</td></tr>`;
    }).join('');
  }

  C.pages.sync = {
    title: '三端同步',
    render() {
      if (!C.can('sync:view')) return `<div class="page-head"><div><h1>三端同步</h1></div></div><section class="panel"><div class="empty"><b>当前角色无查看权限</b>需要 sync:view（会员运营 / 财务 / 管理员）。</div></section>`;
      const chip = (v, t) => `<button class="chip ${view.biz === v ? 'active' : ''}" data-act="syncBiz" data-v="${v}">${t}</button>`;
      const opt = (v, t) => `<option value="${v}" ${view.status === v ? 'selected' : ''}>${t}</option>`;
      return `
        <div class="page-head"><div><h1>三端同步</h1><p>CRM 是唯一账本，时叙、轻疗、在场只保留只读快照。每次写操作同事务写入 outbox，经签名 webhook 推送；业务端返回 2xx 即视为送达。</p></div>
          <span class="tiny muted">${C.can('sync:retry') ? '当前身份可手动重投' : '当前身份只读（重投需 sync:retry）'}</span></div>
        <div class="grid-3" style="margin-bottom:16px">${['sx', 'ql', 'zc'].map(bizCard).join('')}</div>
        <section class="panel" style="margin-bottom:16px"><div class="section-title"><h2>快照落后的会员</h2><span class="tiny">落后期间：展示带「更新于」时间；年卡折扣快照 10 分钟内照常使用，超过则提示稍后再试；积分抵扣一律实时调 CRM</span></div>${staleList()}</section>
        <section class="panel"><div class="section-title"><h2>outbox 事件</h2><span class="tiny">失败按 1 / 5 / 30 分钟、2 / 6 / 12 / 24 小时退避；超过 24 小时转人工队列；消费端只接受比本地更新的版本</span></div>
          <div class="table-tools"><div class="chips">${chip('all', '全部业务')}${chip('sx', '时叙')}${chip('ql', '轻疗')}${chip('zc', '在场')}</div>
            <select data-input="syncStatus" aria-label="投递状态">${opt('all', '全部状态')}${opt('FAILED', '失败 · 待重试')}${opt('DELIVERING', '投递中')}${opt('DELIVERED', '已送达')}</select></div>
          <div class="table-wrap"><table><thead><tr><th>事件</th><th>类型</th><th>目标</th><th>会员</th><th>版本</th><th>状态</th><th>尝试</th><th>响应</th><th></th></tr></thead><tbody>${eventRows()}</tbody></table></div></section>`;
    }
  };

  C.sysAudit = sysAudit;
  C.NAV.forEach((n) => (n.items || []).forEach((i) => { if (i.key === 'sync') i.badge = () => ['sx', 'ql', 'zc'].reduce((s, b) => s + failed(b).length, 0); }));
})();

</script>
<script>/* ==== page-queue.js ==== */

      sum: '积分发放 36 分 · 401 签名失败超 24 小时', pts: 36, idem: 'sx:TH-20261106-0011:earn', earned: '2026-11-06',

      ],
      opts: [['reissue', '按原幂等键补发 36 分', '以 sx:TH-20261106-0011:earn 入账；时叙之后再投同一键只会命中幂等，不会重复发放'], ['void', '作废该出站任务', '确认订单已退款或不应发放时使用，不发放积分']] }
  ];
  const KIND = { AMOUNT_MISMATCH: '开卡金额不符', HOLD_EXPIRED: '积分预占超时', OUTBOUND_24H: '出站超 24 小时' };

  C.RECON = {
    date: '2026-11-06', ran: '2026-11-07 02:00',
    totals: { sx: [41, 40], ql: [27, 26], zc: [18, 18] },
    diffs: [
      { id: 'RD-20261106-0002', biz: 'ql', no: 'FY-2602-008812', order: 'QL-R-20261106-0011', kind: '部分退款未撤回积分', status: 'OPEN',
        bizSide: '部分退款 ¥120（原单 QL-20261102-0117），应撤回 120 分', crmSide: '批次 PB-0398 仍为 380 分', fix: '撤回 120 分（PB-0398：380 → 260）' },
      { id: 'RD-20261106-0001', biz: 'sx', no: 'FY-2512-000012', order: 'TH-20261106-0030', kind: '年卡权益使用缺记', status: 'OPEN',
        bizSide: '松 · 桂花冷萃 年卡优惠 ¥2', crmSide: '卡期 FYC-25-000041 第 1 期无此笔', fix: '补记权益使用 ¥2（影响退卡建议额与月度对账）' }
    ]
  };
  const RD_OPTS = [['biz', '以业务端为准补记', ''], ['crm', '以 CRM 为准', '通知业务端更正本地记录，CRM 不调账'], ['explain', '已解释，不调账', '如跨日订单、对账时点差异']];

  C.CONFLICTS = [

  ];

  C.queueOpen = (k) => k === 'manual' ? C.QUEUE.filter((q) => q.status === 'OPEN').length
    : k === 'recon' ? C.RECON.diffs.filter((d) => d.status === 'OPEN').length
      : C.CONFLICTS.filter((c) => c.status === 'OPEN').length;

  /* ---------- 处理前通用校验 ---------- */
  function readNote() {
    const n = (document.getElementById('qNote') || {}).value || '';
    return n.trim();
  }
  function picked() { const r = document.querySelector('input[name="qOpt"]:checked'); return r ? r.value : ''; }
  const noteField = (ph) => `<label>处理说明（必填，至少 4 个字）<input id="qNote" maxlength="80" placeholder="${E(ph)}"></label>`;
  const optField = (opts) => `<div class="chips" role="radiogroup" aria-label="处理方式">${opts.map(([k, t], i) => `<label class="radio"><input type="radio" name="qOpt" value="${k}" ${i ? '' : 'checked'}>${E(t)}</label>`).join('')}</div>
    <ul class="tiny muted" style="margin:6px 0 0;padding-left:18px">${opts.filter((o) => o[2]).map(([, t, d]) => `<li>${E(t)}：${E(d)}</li>`).join('')}</ul>`;
  const steps = (log) => `<div class="eyebrow" style="margin:14px 0 6px">过程</div><ul class="steps">${log.map((x) => `<li><span class="num tiny muted">${x.at}</span>${E(x.t)}</li>`).join('')}</ul>`;
  const done = (msg) => { C.closeDialog(); C.render(); C.toast(msg); };

  /* FIFO：到期日最早、获得最早优先 */
  function consume(m, pts) {
    let need = pts;
    const parts = [];
    m.batches.filter((b) => b.status === 'ACTIVE' && b.remaining > 0).sort((a, b) => (a.expire + a.earned < b.expire + b.earned ? -1 : 1)).forEach((b) => {
      if (!need) return;
      const take = Math.min(need, b.remaining);
      b.remaining -= take;
      need -= take;
      if (!b.remaining) b.status = 'DEPLETED';
      parts.push(`${b.id}:${take}`);
    });
    return parts.join(' · ');
  }

  /* ---------- 人工队列 ---------- */
  C.act.qView = (el) => {
