# Full愈 CI/CD（单仓库：只看 presence/）
# 触发：presence/ 或有本 workflow 变化并 push 到 main，或手动。先做类型检查与全量构建（server + admin + H5），
# 通过后把前端静态产物同步到 ECS 的 nginx 目录，并更新后端 PM2 进程。
# 实际部署必须显式开启：Settings → Variables 增加 ENABLE_DEPLOY=true。
#
# 线上真实拓扑（非 docker，120.55.36.3 = presence.fullyu.cn；旧名 test-zaichang 已于 2026-11-13 下线）：
#   - 后端：PM2 进程 fullyu-api，源码在 SERVER_PATH（默认 /root/fullyu），在 ECS 上 tsc 编译
#   - 后台静态：nginx 根 ADMIN_DIST_PATH（默认 /opt/fullyu/apps/admin/dist）
#     · presence.fullyu.cn/ 与 :8080 两个入口都直读该目录（2026-11-13 起 presence 不再 proxy 到 8101 容器）
#   - H5 静态：nginx 根 H5_DIST_PATH（默认 /opt/fullyu/apps/miniprogram/dist/build/h5，仅 80 端口 default server）
#   ECS 内存有限，无法构建前端，故前端产物在 runner 构建后 scp 上去。
#
# 需在仓库 Settings → Secrets 配置：
#   ECS_HOST / ECS_USER / ECS_SSH_KEY    部署目标与私钥
#   SERVER_PATH      后端源码目录（默认 /root/fullyu）
#   ADMIN_DIST_PATH  后台 nginx 根（默认 /opt/fullyu/apps/admin/dist）
#   H5_DIST_PATH     H5 nginx 根（默认 /opt/fullyu/apps/miniprogram/dist/build/h5）
#   PM2_APP          后端 PM2 进程名（默认 fullyu-api）
#
# 目录映射（关键）：ECS 上的 SERVER_PATH 是 presence/ 工作区的 rsync 副本，**不是 git 仓库**，
# 且没有 presence/ 这一层——即本地 presence/apps/server ↔ ECS SERVER_PATH/apps/server。
# 因此后端用「源码包 scp + ECS 上编译」而不是 git pull；SERVER_PATH/apps/server/.env.local 需事先放好（指向 RDS/Redis），部署不覆盖它。
# 依赖新增时需在 ECS 上手工 pnpm install（本 workflow 刻意不跑 install，避免 ECS 拉公网依赖）。

name: CI/CD

on:
  push:
    branches: [main]
    # 只有在场代码或本 workflow 变化时才构建/部署，避免时叙、CRM 的提交触发在场发布
    paths:
      - 'presence/**'
      - '.github/workflows/ci-deploy.yml'
  workflow_dispatch:

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check:
    name: 类型检查与构建（在场）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: presence
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          # 单仓库把锁文件放在 presence/ 下，必须显式指定，否则 setup-node 在仓库根找不到 pnpm-lock.yaml 直接失败
          cache-dependency-path: presence/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared (CJS)
        run: pnpm --filter @fullyu/shared build

      - name: Generate Prisma Client
        run: pnpm --filter @fullyu/server db:generate

      - name: Build server
        run: pnpm --filter @fullyu/server build

      - name: Build admin
        run: pnpm --filter @fullyu/admin build

      - name: Build H5
        run: pnpm --filter @fullyu/miniprogram build:h5

      - name: Type-check miniprogram
        run: pnpm --filter @fullyu/miniprogram exec vue-tsc --noEmit -p tsconfig.json

      - name: Package admin dist
        run: tar -czf admin-dist.tar.gz -C apps/admin/dist .

      - name: Package H5 dist
        run: tar -czf h5-dist.tar.gz -C apps/miniprogram/dist/build/h5 .

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: |
            presence/admin-dist.tar.gz
            presence/h5-dist.tar.gz
          if-no-files-found: error

  deploy:
    name: 部署到 ECS
    needs: build-check
    if: github.ref == 'refs/heads/main' && vars.ENABLE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    env:
      SERVER_PATH: ${{ secrets.SERVER_PATH || '/root/fullyu' }}
      ADMIN_DIST_PATH: ${{ secrets.ADMIN_DIST_PATH || '/opt/fullyu/apps/admin/dist' }}
      H5_DIST_PATH: ${{ secrets.H5_DIST_PATH || '/opt/fullyu/apps/miniprogram/dist/build/h5' }}
      PM2_APP: ${{ secrets.PM2_APP || 'fullyu-api' }}
    steps:
      - uses: actions/checkout@v4

      # 后端源码包：ECS 上的 SERVER_PATH 不是 git 副本，只能靠源码包同步（打平 presence/ 一层）
      - name: Package server source
        working-directory: presence
        run: |
          tar -czf ../server-src.tar.gz \
            apps/server/src \
            apps/server/prisma \
            apps/server/package.json \
            apps/server/tsconfig.json \
            apps/server/nest-cli.json \
            packages/shared/src \
            packages/shared/package.json \
            packages/shared/tsconfig.json \
            packages/shared/tsconfig.build.json

      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist

      # 部署前的 Secret 体检：缺哪个就明确报哪个，避免只看到 scp 的 undefined method 之类模糊报错
      - name: Preflight deploy secrets
        env:
          ECS_HOST_V: ${{ secrets.ECS_HOST }}
          ECS_USER_V: ${{ secrets.ECS_USER }}
          ECS_KEY_V: ${{ secrets.ECS_SSH_KEY }}
        run: |
          missing=""
          [ -n "$ECS_HOST_V" ] || missing="$missing ECS_HOST"
          [ -n "$ECS_USER_V" ] || missing="$missing ECS_USER"
          [ -n "$ECS_KEY_V" ] || missing="$missing ECS_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::缺少仓库 Secret:$missing。请在 Settings → Secrets and variables → Actions → Secrets 新建"
            exit 1
          fi
          echo "secrets ok: host=$ECS_HOST_V user=$ECS_USER_V key_lines=$(printf '%s' "$ECS_KEY_V" | grep -c .)"

      # 前端静态产物 + 后端源码包：scp 到 ECS 临时目录，再原子替换 nginx 根 / 覆盖 src（均保留上一份以便回滚）
      - name: Copy dists and server source to ECS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          source: "admin-dist.tar.gz,h5-dist.tar.gz,server-src.tar.gz"
          target: "/tmp/fullyu-ci"
          strip_components: 0

      - name: Sync frontend dist on ECS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          envs: ADMIN_DIST_PATH,H5_DIST_PATH
          script: |
            set -e
            ts=$(date +%Y%m%d-%H%M%S)
            for pair in "/tmp/fullyu-ci/admin-dist.tar.gz:$ADMIN_DIST_PATH" "/tmp/fullyu-ci/h5-dist.tar.gz:$H5_DIST_PATH"; do
              tarball="${pair%%:*}"; dest="${pair##*:}"
              mkdir -p "$dest"
              # 备份旧产物到 /tmp，再清空目标并解包，避免残留陈旧 chunk
              [ -d "$dest" ] && tar -czf "/tmp/$(basename "$dest").bak-$ts.tar.gz" -C "$dest" . 2>/dev/null || true
              rm -rf "$dest"/*
              tar -xzf "$tarball" -C "$dest"
            done
            rm -f /tmp/fullyu-ci/admin-dist.tar.gz /tmp/fullyu-ci/h5-dist.tar.gz

      # 后端：覆盖 src/prisma → 构建 shared → tsc 编译 → prisma db push → 重启 PM2
      # 注意：不跑 pnpm install（ECS 拉公网依赖不稳），依赖有新增时先手工在 ECS 上装好
      - name: Deploy server over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          envs: SERVER_PATH,PM2_APP
          script: |
            set -e
            cd "$SERVER_PATH"
            [ -f /tmp/fullyu-ci/server-src.tar.gz ] || { echo "server-src.tar.gz missing"; exit 1; }
            [ -f apps/server/.env.local ] || { echo "apps/server/.env.local missing"; exit 1; }
            ts=$(date +%Y%m%d-%H%M%S)
            [ -d apps/server/dist ] && tar -czf "/tmp/server-dist.bak-$ts.tar.gz" -C apps/server/dist .
            # 源码包是覆盖解包：先删旧源码目录，避免已下线的文件/路由继续残留
            rm -rf apps/server/src apps/server/prisma packages/shared/src
            tar -xzf /tmp/fullyu-ci/server-src.tar.gz -C "$SERVER_PATH"
            rm -f /tmp/fullyu-ci/server-src.tar.gz
            # 清掉增量编译缓存和旧产物：tsbuildinfo 会把“源码包覆盖但 mtime 未变”误判为无需重编，
            # 导致 dist 缺文件（本次畅练卡下线就有整批路由/服务文件被删除，必须干净重建）
            rm -f apps/server/tsconfig.tsbuildinfo packages/shared/tsconfig.tsbuildinfo
            rm -rf apps/server/dist packages/shared/dist
            export PATH="/root/.local/node/bin:$PATH"
            pnpm --filter @fullyu/shared build
            pnpm --filter @fullyu/server db:generate
            # 生产用 db push（仓库无 migrations 目录），绝不使用 migrate dev / reset
            # 测试库存在历史漂移（5 张遗留表 + orders.points_source 列）。这些表已无代码引用，
            # 但含少量数据，是否 DROP 需人工确认；因此 db push 失败只告警不阻断，避免拖垮整次部署。
            if ! pnpm --filter @fullyu/server exec prisma db push --schema=prisma/schema.prisma; then
              echo "::warning::prisma db push 未执行成功（测试库 schema 漂移，疑似需 DROP 遗留表/列），已跳过；请人工核对后再对齐 schema"
            fi
            cd apps/server
            npx tsc --project tsconfig.json
            # PM2 进程 cwd 已是 $SERVER_PATH/apps/server，重启即可；进程不存在时按该 cwd 拉起
            pm2 restart "$PM2_APP" --update-env \
              || pm2 start dist/main.js --name "$PM2_APP" --cwd "$SERVER_PATH/apps/server" --update-env
            pm2 save
            sleep 3
            curl -fsS "http://127.0.0.1:3000/api/v1/health" >/dev/null && echo "health ok"
