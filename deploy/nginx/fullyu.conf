# Full愈 Nginx 网关配置模板
# 放置于 ECS：/etc/nginx/conf.d/fullyu.conf，替换域名与证书路径后 `nginx -t && nginx -s reload`
#
# 拓扑：
#   - api.yourdomain.com     → 反向代理后端(:3000)。供小程序 request/uploadFile 合法域名、
#                              微信支付回调 /api/v1/payment/notify 使用。
#   - admin.yourdomain.com   → 静态托管 Admin 构建产物(apps/admin/dist) + 同源 /api/v1 反代后端。
#
# 证书：使用已备案域名申请的 SSL 证书（阿里云/Let's Encrypt）。

# 后端上游
upstream fullyu_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ---------- HTTP→HTTPS 跳转（含 ACME 校验放行） ----------
server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.com admin.yourdomain.com;

    # certbot/acme 校验目录（如使用 Let's Encrypt）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- API 域名（后端反代） ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.yourdomain.com;

    ssl_certificate     /etc/nginx/ssl/api.yourdomain.com.pem;
    ssl_certificate_key /etc/nginx/ssl/api.yourdomain.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 上传（经后端代传 OSS）放宽体积限制
    client_max_body_size 20m;

    gzip on;
    gzip_types application/json text/plain application/javascript text/css;
    gzip_min_length 1024;

    # 支付回调需读取原始请求体做验签，禁用缓冲更稳妥
    location /api/v1/payment/notify {
        proxy_pass http://fullyu_backend;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://fullyu_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# ---------- Admin 后台（静态 + 同源 API 反代） ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.yourdomain.com;

    ssl_certificate     /etc/nginx/ssl/admin.yourdomain.com.pem;
    ssl_certificate_key /etc/nginx/ssl/admin.yourdomain.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 20m;

    # Admin 构建产物（pnpm --filter @fullyu/admin build → apps/admin/dist）
    root /var/www/fullyu-admin;
    index index.html;

    gzip on;
    gzip_types application/javascript text/css application/json image/svg+xml;
    gzip_min_length 1024;

    # 静态资源强缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Admin 前端 axios baseURL 为相对 '/api/v1'，此处同源反代到后端
    location /api/v1/ {
        proxy_pass http://fullyu_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
