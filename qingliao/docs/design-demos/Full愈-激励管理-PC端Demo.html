function achievementHTML(p){return `<div class="section-label"><h2>累计成就</h2><small>每一份陪伴都有回响</small></div><section class="achievement"><div class="row small"><b>我的服务足迹</b><span class="muted">独立时间范围</span></div><div class="axis-chips">${[['all','全部'],['30','近30天'],['90','近90天'],['year','今年']].map(([v,t])=>`<button class="chip ${axis.preset===v?'on':''}" data-axis="${v}">${t}</button>`).join('')}</div><div class="axis-inputs"><label>开始日期<input id="axisStart" type="range" min="0" max="286" value="${axis.start}" aria-label="成就统计开始日期"></label><label>结束日期<input id="axisEnd" type="range" min="0" max="286" value="${axis.end}" aria-label="成就统计结束日期"></label></div><div class="axis-caption" id="axisCaption"></div><div class="ach-grid"><div><strong id="achDays"></strong><small>加入天数</small></div><div><strong id="achMinutes"></strong><small>累计服务分钟</small></div><div><strong id="achPeople"></strong><small>服务客人 · 位</small></div></div><div class="fan-row">${icon('heart')}<div><b id="fanName"></b><p id="fanPhone"></p></div><span id="fanMinutes"></span></div><p class="subnote">加入日期 ${p.entry}。范围仅影响累计服务、客人与项目次数；加入天数按今天计算，当月激励不变。</p></section>`;}

function dateAt(offset){const d=new Date('2026-01-08T00:00:00Z');d.setUTCDate(d.getUTCDate()+offset);return d.toISOString().slice(0,10);}
function renderAxis(){const p=person(),records=[];for(let i=0;i<=286;i+=3){const date=dateAt(i),proj=certs[Math.floor(i/3)%3];if(date>=p.entry&&date>proj.date)records.push({date,project:proj.name,minutes:proj.duration,customer:i%27===0?'王女士':'客人'+(i%17)});}const begin=dateAt(axis.start),end=dateAt(axis.end),selected=records.filter(r=>r.date>=begin&&r.date<=end),by={};selected.forEach(r=>by[r.customer]=(by[r.customer]||0)+r.minutes);const top=Object.entries(by).sort((a,b)=>b[1]-a[1])[0];$('axisCaption').textContent=begin+' — '+end;$('achDays').textContent=num(Math.round((Date.parse(TODAY)-Date.parse(p.entry))/86400000)+1);$('achMinutes').textContent=num(selected.reduce((s,r)=>s+r.minutes,0));$('achPeople').textContent=Object.keys(by).length;$('fanName').textContent=top?'头号粉丝 · '+top[0]:'这段时间暂无服务';$('fanPhone').textContent=top?'138****5678 · 号码已脱敏':'换个日期范围看看';$('fanMinutes').textContent=top?top[1]+' 分钟':'';const thirty=dateAt(axis.end-29);$('certList').innerHTML=certs.map(c=>{const rows=selected.filter(r=>r.project===c.name),count30=rows.filter(r=>r.date>=thirty).length;return `<article class="cert-card"><div class="cert-title">${icon('award')}<b>${c.name}</b></div><p>认证通过日 ${c.date} · 次日起计入</p><div class="cert-stats"><div><b>${rows.length}</b><small>认证后服务次数${axis.preset==='all'?'':' · 范围内'}</small></div><div><b>${count30}</b><small>近 30 天 · 范围终点回望</small></div></div></article>`;}).join('');document.querySelectorAll('[data-axis]').forEach(b=>b.classList.toggle('on',b.dataset.axis===axis.preset));}

function simulate(kind){const p=person();if(month!=='2026-10'&&kind!=='reset'){toast('历史月份为演示快照，请切回 10 月试算');return;}switch(kind){case'head':p.weights.push(1);break;case'half':p.weights.push(.5);break;case'return':p.returned=Math.min(p.newCount,p.returned+1);break;case'gate':p.retained=calc(p).eligible?Math.floor(p.senior*(cfg().retention-2)/100):Math.ceil(p.senior*cfg().retention/100);break;case'minutes':p.minutes+=90;break;case'training':if(p.training.includes('eyes')){toast('眼部已计入本月，同一部位不能重复领取补贴');return;}p.training.push('eyes');break;case'shop':{const s=cfg().shops.find(x=>x.id===p.shop);revenues[p.shop]=revenues[p.shop]>=s.target?s.target-10000:s.target+10000;break;}case'reset':people=E.clone(E.PEOPLE);revenues=E.clone(E.REVENUE);month='2026-10';hiddenMoney=false;break;}render();$('scenario').open=true;toast(kind==='reset'?'演示数据已重置，规则配置保留':'已更新模拟数据；未写入真实系统');}

function renderSettings(){const isManager=role==='manager';$('settingsNav').innerHTML=settingTabs.map(([k,t])=>`<button data-tab="${k}" class="${settingsTab===k?'on':''}">${t}${isManager&&k!=='shop'?' · 只读':''}</button>`).join('');$('saveSettings').disabled=isManager;$('effective').value=draft.effective;$('effective').disabled=isManager;$('settingsError').textContent='';let html='';
 if(settingsTab==='repurchase')html=`<h3>复购激励：先满足留存，再计算两类奖励</h3><p>最新要求采用统一 ${draft.retention}% 条件，不默认启用新伙伴或小样本豁免。</p><div class="form-grid">${field('老客 60 天留存率条件（%）','retention',draft.retention,'max="100"')}${field('30 天档位最小新客样本数','minNew',draft.minNew,'step="1"')}</div><hr class="divider"><h3>30 天复购档位 · 取最高一档，不叠加</h3><table><thead><tr><th>新客 30 天复购率 ≥（%）</th><th>档位金额（元）</th></tr></thead><tbody>${draft.tiers.map((t,i)=>`<tr><td><input aria-label="第${i+1}档复购率" type="number" min="0" max="100" step="0.1" data-key="tiers.${i}.rate" value="${t.rate}"></td><td><input aria-label="第${i+1}档金额" type="number" min="0" data-key="tiers.${i}.amount" value="${t.amount}"></td></tr>`).join('')}</tbody></table><hr class="divider"><h3>10 天复购 · 递增单价</h3><div class="form-grid">${field('第 1 位单价（元）','a1',draft.a1)}${field('第 2 位单价（元）','a2',draft.a2)}<div class="full">${field('每位奖励最高单价（元） · 示例值可调整','cap',draft.cap)}</div></div><div class="notice">封顶的是每位单价，不是月度总额。超过上限后，每一个新增复购继续按上限单价计入。同行权重在封顶单价之后相乘。</div><div class="calc-box"><div id="seqPreview"></div><div class="row" style="margin-top:12px"><label>试算完整复购人数 <input class="control" id="testHeads" type="number" min="0" max="100" step="1" value="9" style="width:80px"></label><strong id="testAmount"></strong></div><p class="subnote">此处仅试算 10 天递增金额，正式计入仍受留存条件控制。</p></div>`;
 if(settingsTab==='base')html=`<h3>基础接单系数</h3><p>核对现有代码：月折算上钟分钟 × 当前区间系数，全部分钟用同一个系数。</p><div class="form-grid">${['0–7,200 分钟（含）','>7,200–8,400 分钟（含）','>8,400–9,600 分钟（含）','>9,600 分钟'].map((t,i)=>field(t+' · 元/分钟','coefficients.'+i,draft.coefficients[i])).join('')}${field('新伙伴适用系数 · 元/分钟','newCoefficient',draft.newCoefficient)}</div><div class="notice">保留附件五项设置。区间端点按现有代码“分钟 ≤ 上界”；刚好 7,200 分钟仍为第一档。上钟分钟沿用折算工时，不能用累计成就中的原始服务分钟直接替换。</div><div class="calc-box">8,100 分钟试算：<strong id="basePreview">${cash(8100*E.coefficient(8100,draft))}</strong><p class="subnote">跨区间后整月金额重新计算，不采用分段累进。</p></div>`;
 if(settingsTab==='shop')html=`<h3>整店目标与店长奖励</h3><p>达到目标后计入该店对应店长；普通疗愈师手机页不出现这一项。</p>${draft.shops.filter(s=>!isManager||s.id==='west').map(s=>{const i=draft.shops.findIndex(x=>x.id===s.id);return `<h3 style="margin:16px 0 10px">${s.name}</h3><div class="form-grid">${field('整店月业绩目标（元） · 示例','shops.'+i+'.target',s.target)}${field('完成后店长奖励（元） · 示例','shops.'+i+'.reward',s.reward)}</div>`;}).join('')}<div class="notice">原型采用“门店月业绩 ≥ 目标，固定奖励一次”方案。目标业绩暂以核销服务净额示意，正式业绩口径、目标与金额须业务确认。店长只读查看授权店目标，不自行修改规则。</div>`;
 if(settingsTab==='training')html=`<h3>每个部位，独立配置补贴</h3><p>按认证通过月计入。本原型按同一伙伴同一部位首次通过一次性计入，避免每月重复发放。</p><div class="form-grid">${draft.parts.map((p,i)=>field(p.name+'认证补贴（元） · 示例','parts.'+i+'.amount',p.amount)).join('')}</div><div class="notice">部位认证与项目认证分开：前者决定补贴，后者保留原项目服务次数。原系统尚无自动补贴逻辑；正式接入需维护认证记录和唯一计入凭证。</div>`;
 if(settingsTab==='windows')html=`<h3>统计窗口与清洗口径</h3><p>以结算月为锚点；时间轴仅控制累计成就与项目服务次数。</p><div class="form-grid">${field('老客窗口长度（月）','retentionLength',draft.retentionLength,'step="1" max="12"')}${field('老客窗口末月偏移（月）','retentionOffset',draft.retentionOffset,'step="1" max="12"')}${field('新客窗口长度（月）','conversionLength',draft.conversionLength,'step="1" max="12"')}${field('新客窗口末月偏移（月）','conversionOffset',draft.conversionOffset,'step="1" max="12"')}</div><div class="notice">2026-10 默认老客窗口 2026-03～08，新客窗口 2026-07～09。老客下一次到店间隔 1～60 天，新客 1～30 / 1～10 天。有效订单、退款、首单归属、手机号去重与共同服务权重沿用原统计口径。</div><div class="calc-box">本原型仅演示窗口标签变化。修改窗口后，真实分子分母须由后端订单重新汇总，原型不伪造新统计结果。</div>`;
 if(settingsTab==='history')html=`<h3>配置版本记录</h3><p>本机原型存储。旧月份使用旧规则；不覆盖已经确认的真实结算。</p>${versions.slice().reverse().map(c=>`<div class="history-entry"><div class="row"><b>${c.effective} 起</b><span class="tag">${esc(c.version)}</span></div><p>种子 ${c.a1}/${c.a2} · 每位上限 ${cash(c.cap,0)} · 留存条件 ${c.retention}%</p></div>`).join('')}${audit.length?`<h3 style="margin-top:20px">本地修改留痕</h3>${audit.slice(-5).reverse().map(a=>`<div class="history-entry">${esc(a.time)} · ${esc(a.message)}</div>`).join('')}`:'<p class="subnote">暂无本地修改。9 月为独立历史演示版本。</p>'}`;
 $('settingsContent').innerHTML=`<section class="settings-section">${html}</section>`;if(isManager)$('settingsContent').querySelectorAll('input').forEach(n=>n.disabled=true);document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{settingsTab=b.dataset.tab;renderSettings();});$('settingsContent').querySelectorAll('[data-key]').forEach(n=>n.oninput=()=>{const path=n.dataset.key.split('.');let target=draft;path.slice(0,-1).forEach(k=>target=target[k]);target[path.at(-1)]=n.value===''?NaN:Number(n.value);if(settingsTab==='repurchase')updateTest();if(settingsTab==='base')$('basePreview').textContent=E.validation(draft)?'请检查系数':cash(8100*E.coefficient(8100,draft));});if($('testHeads')){$('testHeads').oninput=updateTest;updateTest();}
}
function updateTest(){const error=E.validation(draft);if(error){$('seqPreview').textContent=error;$('testAmount').textContent='—';return;}const n=Number($('testHeads').value);$('seqPreview').textContent='实际单价：'+E.sequence(10,draft).map(x=>num(x)).join(' → ')+' …';$('testAmount').textContent=Number.isInteger(n)&&n>=0&&n<=100?cash(E.fib(Array(n).fill(1),draft).amount):'请输入 0–100 的整数';}
function saveSettings(){if(role==='manager')return;draft.effective=$('effective').value;const error=E.validation(draft);if(error){$('settingsError').textContent=error;return;}if(draft.effective<'2026-10'){$('settingsError').textContent='历史月份在原型中只读，请选 2026-10 或之后的新版本';return;}const previous=versions.find(x=>x.effective===draft.effective),v=E.clone(draft);v.version=v.effective+' · 演示修订 '+(audit.length+1);audit.push({time:new Date().toLocaleString('zh-CN'),message:`保存 ${v.effective} 规则；上限 ${v.cap} 元`,previous:previous?E.clone(previous):null});versions=versions.filter(x=>x.effective!==v.effective).concat(v);persist();$('settingsDialog').close();render();$('settingsOpen')?.focus({preventScroll:true});toast(v.effective>month?'已保存未来演示版本，当前月份保持原规则':'示例设置已保存，报表与手机预览已更新');}
window.addEventListener('storage',event=>{if(event.key===STORE){try{const s=JSON.parse(event.newValue);if(s?.versions?.every(x=>!E.validation(x))){versions=s.versions;audit=s.audit||[];render();}}catch(e){}}});
$('effective').onchange=e=>{if(draft)draft.effective=e.target.value;};$('saveSettings').onclick=saveSettings;document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).close());
window.demo={engine:E,get state(){return {versions,people,revenues,month,personId,role,axis};},render,calculate:calc};
render();
})();
</script></body></html>
