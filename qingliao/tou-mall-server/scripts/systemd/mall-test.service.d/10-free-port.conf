# 部署到 /etc/systemd/system/mall-test.service.d/10-free-port.conf 后执行 systemctl daemon-reload。
#
# 野进程（手工 setsid 启动 / guard 拉起）不受 systemd 管辖时会占住 19929，
# systemctl restart 变成「新实例 PortInUse 退出、旧进程继续服务」，代码不生效
# （2026-11-18 测试环境大会员页事故）。启动前先释放端口，脚本见 free-port.sh。
[Service]
ExecStartPre=-/opt/fullyu-mall-test/free-port.sh 19929
