    <style>
        #tip-con {
            margin: 20px;
            margin-top: 10%;
            display: none;
        }
        .tip-icon {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        #tip-info {
            font-size: 18px;
            color: #333;
            display: flex;
            justify-content: center;
        }
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #09BB07;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #success-icon {
            display: none;
        }
    </style>

    <script>
  const Base = 'https://manage.fullytherapy.com'
  const Base2 = 'https://manage.fullytherapy.com'
  // const Base2 = 'https://proxy.sanliu.top'

  const Apis = {
    orderInfo: Base2 + '/api/admin/open/dgpay/order/info',
    getPayInfo: Base2 + '/api/admin/open/dgpay/wxWapPay',
  }

  const showLoading = () => {
      // 动态插入Loading元素
      const loadingDiv = document.createElement('div');
      loadingDiv.id = 'loading';
      loadingDiv.innerHTML = '<div class="spinner"></div>';
      document.body.prepend(loadingDiv); // 置于页面顶部

      // // 监听页面加载完成事件
      // window.addEventListener('load', () => {
      //     loadingDiv.style.display = 'none'; // 隐藏Loading
      // });
      //
      // // 兼容性方案：若load事件未触发，检查document.readyState
      // document.onreadystatechange = () => {
      //     if (document.readyState === 'complete') {
      //         loadingDiv.style.display = 'none';
      //     }
      // };
  }

  const closeLoading = () => {
      let loadingElem = document.getElementById('loading');
      if (loadingElem) {
          loadingElem.style.display = 'none'
      }
  }

  const tip = (msg, duration=3000, type='warning') => {
      let tipCon = document.getElementById('tip-con')
      if (tipCon) {
          tipCon.style.display = 'block'

          let tipInfo = document.getElementById('tip-info')
          if (tipInfo) {
              tipInfo.innerText = msg
          }
      }

      if (duration !== -1) {
          setTimeout(() => {
              tipCon.style.display = 'none'
          }, duration)
      }
      if (type === 'success') {
          document.getElementById('success-icon').style.display = 'block'
          document.getElementById('warn-icon').style.display = 'none'
      } else {
          document.getElementById('success-icon').style.display = 'none'
          document.getElementById('warn-icon').style.display = 'block'
      }

      closeLoading()
  }

  const getUrlParams = function(paramName) {
      let url = window.location.href
      let getqyinfo = url.split('?')[1]
      let getqys = getqyinfo.split('&')
      let obj = {}  //创建空对象，接收截取的参数
      for(let i = 0;i < getqys.length;i++ ){
          let item = getqys[i].split('=')
          let key = item[0]
          let value = item[1]
          obj[key] = value
          if (key === paramName) {
              return value
          }
      }

      return null;
  }
  const isWeChat = function(){
      return /MicroMessenger/i.test(window.navigator.userAgent);
  }

  const getOrderInfo = function(_orderSn, _code) {
      fetch(`${Apis.orderInfo}?orderSn=${_orderSn}&code=${_code}`)
          .then(response => response.json())
          .then(function(res) {
          console.log(res)
          if (res && res.code === 200) {
              let respData = res.data
              if (respData) {
                  let orderInfo = respData.orderInfo
                  let openId = respData.openId
                  getPayInfo(orderInfo.code, openId)
              } else {
                  tip('获取订单信息失败', -1)
              }
          } else {
              tip('获取订单信息失败,' + res.message, -1)
          }
      }).catch(err => {
          console.error(err)
          tip('获取订单信息失败', -1)
      })
  }

  const getPayInfo = (_orderSn, openId) => {
      fetch(`${Apis.getPayInfo}?orderSn=${_orderSn}&openId=${openId}`,{
          method: 'post',
      }).then(resp => resp.json())
          .then(function(res) {
          console.log(res)

          if (res && res.code === 200) {
              let respData = res.data

              // 检测支付环境中的 WeixinJSBridge
              if (typeof WeixinJSBridge == "undefined") {
                  if (document.addEventListener) {
                      document.addEventListener('WeixinJSBridgeReady', onBridgeReady, false);
                  } else if (document.attachEvent) {
                      document.attachEvent('WeixinJSBridgeReady', onBridgeReady);
                      document.attachEvent('onWeixinJSBridgeReady', onBridgeReady);
                  }
              } else {
                  // 获取订单支付信息
                  if (!respData || !respData.payParams) {
                      tip('获取支付信息失败', 'error')
                      return false
                  }
                  let {appId, timeStamp, package, paySign,nonceStr, signType} = respData.payParams

                  WeixinJSBridge.invoke(
                      'getBrandWCPayRequest', {
                          "appId": appId, //公众号名称，由商户传入
                          "timeStamp": timeStamp, //时间戳，自1970年以来的秒数
                          "nonceStr": nonceStr, //随机串
                          "package": package,
                          "signType": signType, //微信签名方式：
                          "paySign": paySign //微信签名
                      },
                      function(res) {
                          // 支付成功
                          if (res.err_msg == "get_brand_wcpay_request:ok") {
                              // 使用以上方式判断前端返回,微信团队郑重提示：
                              //res.err_msg将在用户支付成功后返回ok，但并不保证它绝对可靠。
                              tip('支付完成', -1, 'success')
                              setTimeout(() => {
                                  window.close()
                              }, 3000)
                          }
                          // 支付过程中用户取消
                          if (res.err_msg == "get_brand_wcpay_request:cancel") {
                              tip('支付已取消', -1)
                          }
                          // 支付失败
                          if (res.err_msg == "get_brand_wcpay_request:fail") {
                              tip('支付失败', -1)
                          }
                          /**
                           * 其它
                           * 1、请检查预支付会话标识prepay_id是否已失效
                           * 2、请求的appid与下单接口的appid是否一致
                           * */
                          if (res.err_msg == "调用支付JSAPI缺少参数：total_fee") {
                              tip('支付失败', -1)
                          }
                      })
              }
          } else {
              let msg = res.message
              if (msg && msg.includes('支付失败')) {
                  tip(res.message, -1)
              } else {
                  tip('支付失败,' + res.message, -1)
              }
          }
      }).catch(function(err) {
          console.error(err)
          tip('支付失败,请联系客服人员处理', -1)
      })
  }

  showLoading()

  window.onload = function () {
      let orderSnVal = getUrlParams('orderSn')
      let appIdVal = getUrlParams('appId')
      let codeVal = getUrlParams('code')

      if (isWeChat()) {
          if (!codeVal || codeVal === 'null') {
              // 未授权openId
              // let urlNow = window.location.href
              console.log('getCode')
              let urlNow = Base + '/wxWapPay/wx.html'
              let scope = 'snsapi_base'
              let url=`https://open.weixin.qq.com/connect/oauth2/authorize?appid=${appIdVal}&redirect_uri=${encodeURIComponent(urlNow)}&response_type=code&scope=${scope}&state=${orderSnVal}&connect_redirect=1#wechat_redirect`;
              console.log(url)
              window.location.replace(url);
          } else {
              // 已拿到code，请求后台获取openId
              console.log('code=', codeVal)
              let orderSnVal = getUrlParams('state')
              console.log(window.location.href)
              if (orderSnVal) {
                  orderSnVal = orderSnVal.replace("#/", "")
              }
              console.log('orderSn', orderSnVal)
              getOrderInfo(orderSnVal, codeVal)
          }
      } else {
          // 非微信
          tip('请使用微信扫码支付', -1)
          setTimeout(() => {
              window.close()
          }, 3000)
      }
  }
</script>
