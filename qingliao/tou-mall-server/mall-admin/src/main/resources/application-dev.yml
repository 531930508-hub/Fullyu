spring:
  datasource:
    url: jdbc:mysql://rm-bp127cdsipvc7dtseno.mysql.rds.aliyuncs.com:3306/tou_mall_demo?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:fully}
    password: ${DB_PASSWORD:}
    druid:
      initial-size: 5 #连接池初始化大小
      min-idle: 10 #最小空闲连接数
      max-active: 20 #最大连接数
      web-stat-filter:
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*" #不统计这些请求数据
      stat-view-servlet: #访问监控网页的登录用户名和密码
        login-username: druid
        login-password: druid
  redis:
    host: 192.168.10.100 # Redis服务器地址
    database: 3 # Redis数据库索引（默认为0）
    port: 6379 # Redis服务器连接端口
    password: # Redis服务器连接密码（默认为空）
    timeout: 5000 # 连接超时时间（毫秒）
  rabbitmq:
    host: 192.168.10.100
    port: 5672
    virtual-host: /test
    username: mall
    password: ${RABBITMQ_PASSWORD:}
    publisher-confirm-type: CORRELATED
    # 开启消息回退监听
    publisher-returns: true
    listener:
      simple:
        # 自动ACK
        acknowledge-mode: AUTO
        #重试次数超过上面的设置之后是否丢弃（false不丢弃时需要写相应代码将该消息加入死信队列）
        default-requeue-rejected: false
        #并发消费者初始化值
        concurrency: 20
        #并发消费者的最大值
        max-concurrency: 20
        #每个消费者每次监听时可拉取处理的消息数量
        prefetch: 1
        #        重试
        retry:
          enabled: true
          max-attempts: 5 # 重试次数
          max-interval: 10000   # 重试最大间隔时间
          initial-interval: 2000  # 重试初始间隔时间
          multiplier: 2 # 间隔时间乘子，间隔时间*乘子=下一次的间隔时间，最大不能超过设置的最大间隔时间

minio:
  endpoint: http://localhost:9000 #MinIO服务所在地址
  bucketName: mall #存储桶名称
  accessKey: ${MINIO_ACCESS_KEY:minioadmin} #访问的key
  secretKey: ${MINIO_SECRET_KEY:minioadmin} #访问的秘钥

logging:
  level:
    root: info
    com.macro.mall: debug

logstash:
  host: localhost
  enableInnerLog: false

# 小票打印
print:
  user: ${PRINT_USER:}
  ukey: ${PRINT_UKEY:}
  sn: ${PRINT_SN:}
  appid: ${PRINT_APPID:}
  appsecret: ${PRINT_APPSECRET:}

# 百度语音识别/合成
baidu:
  voice:
    appId: ${BAIDU_VOICE_APP_ID:}
    apiKey: ${BAIDU_VOICE_API_KEY:}
    secretKey: ${BAIDU_VOICE_SECRET_KEY:}