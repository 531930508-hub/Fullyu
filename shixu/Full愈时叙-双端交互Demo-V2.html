:root{--paper:#f6f4ef;--canvas:#eeece6;--card:#fffefa;--ink:#352f2b;--muted:#68625b;--line:#dedbd3;--wood:#694b3d;--accent:#a26843;--apricot:#f1deca;--sage:#dde5d9;--rose:#edd9cf;--lilac:#e5e0ee;--blue:#e0e9ed;--success:#46684f;--danger:#a34338;--warning:#86571d;--shadow:0 14px 55px #352f2b15;--r-sm:10px;--r:18px;--r-lg:28px;--ease:160ms ease;--font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--canvas);font-family:var(--font);color:var(--ink);font-size:14px;line-height:1.6}button,input,select,textarea{font:inherit;color:inherit}button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}button{cursor:pointer;border:0;background:none;transition:background var(--ease),transform var(--ease)}button:disabled{cursor:not-allowed;opacity:.48}button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}a{color:inherit}h1,h2,h3,h4,p{margin:0}h1,h2,h3,h4{font-weight:550}svg{flex-shrink:0;vertical-align:middle}button svg{pointer-events:none}input,select,textarea{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;background:var(--card);max-width:100%}input[type=checkbox]{accent-color:var(--wood);width:18px;height:18px}textarea{width:100%;resize:vertical;min-height:76px}button:hover:not(:disabled){filter:brightness(.97)}.muted{color:var(--muted)}.small{font-size:12px}.tiny{font-size:11px}.eyebrow{font-size:10px;letter-spacing:2px;font-weight:600;text-transform:uppercase;color:var(--muted)}.serif{font-family:Georgia,"Songti SC","STSong",serif}.flex{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}.stack{display:flex;flex-direction:column;gap:14px}.divider{border:0;border-top:1px solid var(--line);margin:18px 0}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);border-radius:10px;min-height:44px;padding:10px 17px;background:var(--card);font-weight:500}.btn.primary{background:var(--ink);color:var(--card);border-color:var(--ink)}.btn.soft{background:var(--paper);border-color:transparent}.btn.danger{color:var(--danger);border-color:#dcbeb9}.btn.compact{padding:7px 12px;min-height:38px;font-size:12px}.btn.full{width:100%}.text-btn{padding:8px 0;display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--wood);min-height:40px}.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card)}.pill{display:inline-flex;align-items:center;gap:5px;border-radius:6px;background:var(--paper);padding:3px 8px;font-size:11px;white-space:nowrap}.pill.green{color:var(--success);background:#eaf0e7}.pill.amber{background:#f5e8d2;color:var(--warning)}.pill.red{background:#f8e8e3;color:var(--danger)}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor}.note{font-size:12px;line-height:1.75;color:var(--muted);background:var(--paper);padding:12px 14px;border-radius:10px}.notice{padding:12px 16px;background:#f5e8d2;color:#654719;border:1px solid #e9d1a8;border-radius:12px;margin-bottom:16px;display:flex;align-items:center;gap:10px}.error-inline{color:var(--danger);background:#f8e8e3;padding:12px;border-radius:10px;margin:12px 0}.empty{padding:42px 16px;text-align:center;color:var(--muted)}.empty h3{color:var(--ink);margin:12px 0 5px}.empty .btn{margin-top:16px}.price{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}.price small{font-size:12px;font-weight:400}.badge-count{font-variant-numeric:tabular-nums}.brand{font-weight:600;letter-spacing:1px;font-size:17px}.brand small{display:block;font-size:9px;letter-spacing:3px;font-weight:400;margin-top:0}.app-top{height:66px;background:var(--card);border-bottom:1px solid var(--line);padding:0 28px;display:flex;align-items:center;justify-content:space-between;gap:20px;position:relative;z-index:20}.app-top .brand{font-size:16px}.surface-switch{display:flex;background:var(--paper);padding:4px;gap:3px;border-radius:12px}.surface-switch button{padding:8px 19px;border-radius:9px;min-height:38px;color:var(--muted);font-size:13px}.surface-switch button.active{background:var(--ink);color:var(--card)}.demo-tag{border:1px solid var(--line);font-size:11px;border .sidebar-brand small{display:block;font-size:8px;letter-spacing:1.6px;color:var(--muted);line-height:1.5}
.range-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:18px}
.range-bar button{min-height:34px;padding:5px 12px;border:1px solid var(--line);border-radius:20px;background:var(--card);font-size:12px;color:var(--muted)}

.series-tile:hover:not(:disabled){filter:brightness(.98)}
.series-tile .serif{display:block;font-size:25px;line-height:1.3}
.series-tile small{display:block;font-size:8px;letter-spacing:1.3px;margin:2px 0 0}
.series-tile span{margin-top:2px}
.series-tile .tiny{color:#57514a}
.batch-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:14px}
.batch-bar .checkbox-label{min-height:32px;gap:7px}
.detail-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:18px}
.detail-metrics>div{padding:14px 10px;border-radius:12px;background:var(--paper);text-align:center}
.detail-metrics strong{display:block;font-size:24px;font-weight:500;line-height:1.4;font-variant-numeric:tabular-nums}
.detail-metrics span{display:block;font-size:11px;color:var(--muted)}
.detail-metrics small{display:block;margin-top:4px;font-size:10px;color:var(--muted)}
.bar-row{grid-template-columns:76px minmax(0,1fr) 104px}
.bar-row>span:last-child{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.finance-amount{font-variant-numeric:tabular-nums;font-weight:550;color:var(--success)}
.finance-amount.negative{color:var(--danger)}
.mapping-table input{width:100%;min-width:96px;padding:7px 9px;font-size:12px}
.mapping-table td{vertical-align:middle}
.hq-store-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}
.hq-store-grid .panel h2{font-size:18px}
.hq-store-grid .setting-row{flex-wrap:wrap;gap:8px}
.hq-store-grid .setting-row>div{min-width:0;flex:1 1 180px}
.hq-store-grid .section-space{flex-wrap:wrap;gap:8px}
.hq-store-grid .text-btn{white-space:nowrap}
.check-col{width:38px;text-align:center;padding-left:10px!important;padding-right:6px!important}
.check-col input{width:16px;height:16px}
.visually-hidden{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.receipt .order-number.long{font-size:clamp(22px,6.5vw,30px);letter-spacing:.5px;line-height:1.35;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}

/* V4 · accounts, roles, store scope and refund approvals */
.identity-select{max-width:210px;font-size:12px}
.sidebar-user{display:flex;gap:10px;align-items:center;margin-top:16px;padding:13px 10px;border-top:1px solid var(--line);min-width:0}
.sidebar-user>span{width:30px;height:30px;border-radius:50%;background:var(--paper);border:1px solid var(--line);display:grid;place-items:center;font-family:Georgia,"Songti SC",serif;font-size:14px;flex-shrink:0}
.sidebar-user>div{min-width:0}
.sidebar-user strong,.sidebar-user small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidebar-user strong{font-size:12px;line-height:1.5}
.sidebar-user small{font-size:10px;color:var(--muted);line-height:1.5}
.access-denied{max-width:620px;margin:40px auto;text-align:center}
.access-denied h2{margin:14px 0 8px}
.access-denied .flex{justify-content:center;margin-top:20px}
.denied-icon{width:54px;height:54px;border-radius:50%;background:var(--paper);display:inline-grid;place-items:center;color:var(--wood)}
.role-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
.role-card{display:flex;flex-direction:column;gap:4px}
.role-card h2{font-size:16px}
.role-card .role-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.role-card .flex.wrap{margin-top:auto;padding-top:12px;gap:4px}
.role-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.perm-tree{display:flex;flex-direction:column;gap:2px}
.perm-tree .perm-module{padding:12px 0;border-top:1px solid var(--line)}
.perm-tree .perm-module:first-child{border-top:0;padding-top:2px}
.perm-module h3{font-size:12px;color:var(--muted);letter-spacing:1px;margin-bottom:9px}
.perm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:7px 14px;margin-top:4px}
.perm-grid .checkbox-label{align-items:flex-start;padding:6px 0;line-height:1.5}
.perm-grid .checkbox-label input{margin-top:2px;flex-shrink:0}
.perm-grid .checkbox-label span{min-width:0}
.perm-pill{margin:0 6px 6px 0;padding:4px 9px}
.approval-list{display:flex;flex-direction:column;gap:12px}
.approval-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.approval-card h3{font-size:16px;margin:7px 0 3px;font-variant-numeric:tabular-nums}
.approval-card .flex.wrap{margin-top:13px;gap:8px}
.approval-lines{background:var(--paper);border-radius:10px;padding:10px 12px;font-size:12px;margin:13px 0 6px;overflow-wrap:anywhere}
.approval-steps{list-style:none;margin:0;padding:0}
.approval-steps li{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.approval-steps li:last-child{border-bottom:0}
.approval-steps>li>span{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center;font-size:11px;flex-shrink:0;color:var(--muted)}
.approval-steps li.processing>span{background:var(--ink);border-color:var(--ink);color:var(--card)}
.approval-steps li.approved>span{background:#eaf0e7;border-color:#cfdbc8;color:var(--success)}
.approval-steps li.rejected>span{background:#f8e8e3;border-color:#dcbeb9;color:var(--danger)}
.approval-steps li div{min-width:0}
.approval-steps li strong{font-size:13px;margin-right:7px}
.approval-steps li p{margin-top:3px;overflow-wrap:anywhere}
.approval-path{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--sage);border-radius:12px;padding:14px 16px;margin:18px 0;font-size:12px}
.approval-path strong{font-weight:550}
.approval-flow .form-grid{margin-top:6px}
.approval-flow .perm-grid{margin-top:6px}
@media(max-width:900px){.sidebar-user{display:none}.identity-select{max-width:100%;flex:1}}
@media(max-width:680px){.role-grid{grid-template-columns:1fr}.approval-card{padding:14px}.access-denied{margin:20px auto}.access-denied .flex .btn{flex:1}.perm-grid{grid-template-columns:1fr}.approval-path{gap:7px;font-size:11px}.table-tools .identity-select{max-width:100%}}
/* V5 · review update: cup scanning, pickup codes, member QR, table QR, loss watch (retained in V6) */
.cup-list{display:flex;flex-direction:column;gap:7px;margin:0 0 10px}
.order-card .cup-list{padding:0 17px}
.cup-row{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--paper);min-width:0}
.cup-row.ready{background:#eef2ea;border-color:#cfdbc8}
.cup-row.refunded{opacity:.55;text-decoration:line-through}
.cup-no{font-family:ui-monospace,Menlo,"SF Mono",monospace;font-size:12px;font-weight:600;letter-spacing:.2px;color:var(--wood);flex-shrink:0;font-variant-numeric:tabular-nums}
.cup-info{min-width:0;flex:1}
.cup-info strong{display:block;font-size:12px;line-height:1.4;overflow-wrap:anywhere}
.cup-info small{display:block;font-size:10px;color:var(--muted);line-height:1.45}
.cup-row .btn.compact{min-height:32px;padding:5px 10px;font-size:11px}
.cup-progress{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px 16px;margin:16px 0;text-align:left}
.cup-progress .cup-row{background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:8px 0}
.cup-progress .cup-row:last-child{border-bottom:0}
.cup-progress-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 14px}
.pickup-line{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--paper);border:1px dashed #cdc7bc;border-radius:10px;padding:10px 13px;margin:12px 0}
.pickup-code{font-family:ui-monospace,Menlo,"SF Mono",monospace;font-size:16px;letter-spacing:1px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pickup-code.full{display:block;font-size:20px;letter-spacing:2px;margin:6px 0 4px;white-space:normal;overflow-wrap:anywhere}
.pickup-box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:16px 0;text-align:center}
.qr-wrap{display:flex;justify-content:center;margin:10px 0}
.qr-svg{width:154px;height:154px;max-width:100%}
.member-code-card .member-qr{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px;width:max-content;margin:13px auto 8px}
.member-qr .qr-svg{width:122px;height:122px}
.member-qr.large .qr-svg{width:188px;height:188px}
.member-code{display:block;text-align:center;font-family:ui-monospace,Menlo,"SF Mono",monospace;font-size:14px;letter-spacing:1.5px;color:var(--wood);font-variant-numeric:tabular-nums}
.member-code-sheet{text-align:center;padding:4px 0}
.member-code-sheet .member-qr{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;width:max-content;margin:13px auto 8px}
.member-code-sheet .member-code{font-size:18px;margin:10px 0 6px}
.store-ack{display:flex;gap:9px;align-items:flex-start;margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--paper);font-size:11px;line-height:1.6;color:var(--muted)}
.store-ack.ok{background:#eef2ea;color:var(--success)}
.pay-store-card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px}
.pay-store-card h3{font-size:20px;margin:7px 0}
.pay-store-card p{font-size:12px;color:var(--muted);margin-top:4px}
.scan-frame{width:168px;height:150px;margin:8px auto 14px;border:1px dashed #b9b3a8;border-radius:14px;background:linear-gradient(180deg,#fbf9f4,#f1eee7);display:grid;place-items:center;color:var(--wood);position:relative;overflow:hidden}
.scan-frame:after{content:"";position:absolute;left:14px;right:14px;height:2px;background:var(--accent);top:50%;opacity:.45}
.scan-frame.compact{width:130px;height:108px}
.member-mini{display:flex;gap:12px;align-items:center;background:var(--paper);border-radius:12px;padding:10px 12px;margin-top:6px}
.member-mini .qr-svg{width:62px;height:62px;background:var(--card);border-radius:6px;padding:3px}
.member-mini strong{display:block;font-size:12px}
.member-mini small{display:block;font-size:10px;color:var(--muted);line-height:1.5}
.pos-member-box{background:var(--paper);border-radius:10px;padding:11px 12px;margin-bottom:10px}
.pos-member-box strong{font-size:12px}
.pos-member-box p{margin-top:2px}
.pos-member-box .text-btn{min-height:30px;padding:3px 0}
.pay-mode-toggle{display:flex;margin:16px 0 4px;width:100%}
.pay-mode-toggle button{flex:1;min-height:38px;font-size:12px}
.loss-watch.warn{border-color:#dcbeb9;background:#fff9f6}
.loss-watch .section-title{margin-bottom:14px}
.loss-watch-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}

.loss-store.over{border-color:#dcbeb9;background:#fdf3ef}
.loss-store strong{font-size:12px}
.loss-store p{margin-top:2px}
.ratio-bar{height:7px;border-radius:4px;background:#e4e0d8;overflow:hidden;margin:9px 0 7px}

 });

 function store(id=ui.store){return S.stores[id];}
 function persist(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch{toast('浏览器存储不可用，当前演示仅保留在本页');}try{sessionStorage.setItem(KEY+'-ui',JSON.stringify(ui));}catch{}}
 let toastTimer;
 function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('visible'),3200);}
 let modalType='',modalData={};
 function modal(title,body,{wide=false,type='',data={}}={}){const el=document.getElementById('sheet');modalType=type;modalData=data;el.className=wide?'wide':'';el.innerHTML=`<div class="sheet-head"><h2 id="sheet-title">${esc(title)}</h2>${btn(icon('close',18),'close','icon-btn',`aria-label="${t('关闭弹窗','Close dialog')}"`)}</div><div class="sheet-body">${body}</div>`;if(!el.open)el.showModal();}
 function close(){document.getElementById('sheet').close();modalType='';}
 const t=(zh,en)=>ui.locale==='en'&&ui.surface==='mini'?en:zh;
 const pname=p=>t(p.name,p.nameEn||p.name);
 const storeName=st=>t(st.name,st.nameEn);
 const spec=v=>t(v,({'热':'Hot','冰':'Iced','冰镇':'Chilled','标准冰':'Regular ice','少冰':'Less ice','杯':'cup','瓶':'bottle','枚':'pack','盒':'box','袋':'bag'})[v]||v.replace('吧台','Counter ').replace('窗边','Window ').replace('桌',' Table'));
 const status=o=>t(({pending:'待出餐',ready:'已出餐',awaiting:'待领取',delivered:'已交付',refunded:'已退款'})[o.status],({pending:'Preparing',ready:'Ready',awaiting:'To collect',delivered:'Collected',refunded:'Refunded'})[o.status]);
 function orderLabel(o){return o.business==='retail'?t('任意门店领取','Pickup at any store'):o.type==='dine'?spec(o.seat):o.type==='takeaway'?t('现场外带','Takeaway'):o.platformNo;}
 function elapsed(o){return Math.max(0,Math.floor((Date.now()-o.createdAt)/60000));}

 const DAY=864e5;
 function bounds(kind='today',from='',to=''){
  const now=new Date(),start=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
  if(kind==='7')return {from:start-6*DAY,to:start+DAY};
  if(kind==='30')return {from:start-29*DAY,to:start+DAY};
  if(kind==='custom'){
   const f=from?new Date(from+'T00:00:00').getTime():start,t=to?new Date(to+'T00:00:00').getTime():start;
   if(!Number.isFinite(f)||!Number.isFinite(t))return {from:start,to:start+DAY};
   return {from:Math.min(f,t),to:Math.max(f,t)+DAY};
  }
  return {from:start,to:start+DAY};
 }

 function inventory(){const st=U.store(ui.opsStore),tea=U.S.products.filter(p=>p.kind==='tea');return `<div class="table-tools"><div><h2>${e(st.name)} · 原料与入库</h2><p class="small muted">配方、SKU映射与单位换算由总部统一维护；本店只调整可用库存和模拟验收入库。</p></div>${b('模拟在场验收入库','new-receipt','btn primary')}</div><div class="integration-flow"><span>总部统一SKU映射</span>${i('arrow',18)}<span>门店验收实收数量</span>${i('arrow',18)}<strong>本店可用库存增加</strong></div><p class="note">按实收、仓库与商品入账；拒收不增加库存。重复入库单不重复增加。每杯用量读取总部配方，不在门店修改。</p><div class="table-wrap section-space"><table><thead><tr><th>独立散茶 / 总部配方</th><th>可用原料</th><th>预计剩余杯数</th><th>在场SKU映射（只读）</th><th>调整</th></tr></thead><tbody>${tea.map(p=>{const mp=U.S.mappings.find(x=>x.productId===p.id);return `<tr><td><strong>${e(p.name)}</strong><p class="tiny muted">每杯 ${p.dose} g</p></td><td>${st.stock[p.id]||0} g</td><td><strong>${Math.floor((st.stock[p.id]||0)/p.dose)} 杯</strong></td><td>${mp?`${e(mp.externalId)}<p class="tiny muted">1 ${e(mp.unit)} = ${mp.factor} g · 总部配置</p>`:'未映射'}</td><td>${b('库存调整','adjust-stock','text-btn',`data-id="${p.id}"`)}</td></tr>`;}).join('')}</tbody></table></div><div class="panel section-space"><h2>最近同步记录</h2>${U.S.receipts.filter(r=>r.warehouseId===ui.opsStore).length?U.S.receipts.filter(r=>r.warehouseId===ui.opsStore).map(r=>`<div class="setting-row"><div><strong>${e(r.id)}</strong><p>${e(r.poId)} · ${U.dateTime(r.at)} · ${r.details.map(l=>e(l.name)+' +'+l.grams+'g').join(' / ')}</p></div>${b('重放同一事件','replay-receipt','btn compact',`data-id="${e(r.id)}"`)}</div>`).join(''):'<p class="small muted">还没有模拟入库。点右上角体验实收 → 库存 → 可做杯数联动。</p>'}</div><div class="panel section-space"><h2>成品库存 · 零售 / 瓶装</h2><div class="compact-stock">${U.S.products.filter(p=>p.kind!=='tea').map(p=>`<div class="setting-row"><div><strong>${e(p.name)}</strong><p>${st.stock[p.id]||0} ${e(p.unit)} · ${p.kind==='retail'?'交付后才扣本店库存；全店可售 '+D.retailAvailable(U.S,p.id)+' 件':'下单时预留'}</p></div>${b('调整','adjust-stock','btn compact',`data-id="${p.id}"`)}</div>`).join('')}</div></div>`;}

  if(el.dataset.change==='dash-from'){ui.dashFrom=el.value;render();}if(el.dataset.change==='dash-to'){ui.dashTo=el.value;render();}if(el.dataset.change==='finance-from'){ui.financeFrom=el.value;render();}if(el.dataset.change==='finance-to'){ui.financeTo=el.value;render();}if(el.dataset.change==='finance-store'){ui.financeStore=el.value;render();}if(el.dataset.change==='stock-kind'){ui.stockKind=el.value;render();}if(el.dataset.change==='loss-status'){ui.lossStatus=el.value;render();}if(el.dataset.change==='loss-store'){ui.lossStore=el.value;render();}if(el.dataset.change==='expense-file'){const file=el.files?.[0];if(!file)return;if(file.size>1024*1024)throw Error('CSV 文件需小于 1MB');const text=await file.text(),sheet=document.getElementById('expense-sheet');if(sheet){sheet.value=text;ui.expenseSheet=text;refreshExpensePreview();U.toast(`已读取 ${file.name}`);}}

</script><script>(()=>{

 document.getElementById('app').innerHTML=`<header class="app-top"><div class="brand">Full愈·时叙 <span class="demo-tag">INTERACTIVE DEMO</span></div><nav class="surface-switch" aria-label="切换演示端">${[['mini',U.t('顾客小程序','Customer')],['workbench',U.t('平板营业台','Workbench')],['manage',U.t('管理后台','Admin')]].map(([id,n])=>b(n,'surface',ui.surface===id?'active':'',`data-surface="${id}"`)).join('')}</nav>${b(i('info',16)+U.t('演示说明','About'),'about','text-btn')}</header>${ui.surface==='mini'?Customer.render():Ops.render()}`;
 if(!resetScroll&&document.getElementById('phone-content'))document.getElementById('phone-content').scrollTop=scroll;
 if(focusId){const next=document.getElementById(focusId);if(next){next.focus({preventScroll:true});if(selection!==null)try{next.setSelectionRange(selection,selection);}catch{}}}U.persist();
}
const STORE_PAGES=['workbench','pos','retail','orders','availability','inventory','loss','dashboard','stores','logs'],HQ_PAGES=['hq-overview','finance','approvals','hq-loss','products','categories','mappings','hq-stores','rbac','hq-logs'];
function surface(id){ui.surface=id;const pages=id==='manage'?HQ_PAGES:id==='workbench'?STORE_PAGES:null;if(pages&&!pages.includes(ui.opsPage))ui.opsPage=U.firstPage(id)||(id==='manage'?'hq-overview':'workbench');history.replaceState(null,'','#'+id);render(true);}

function switchStaff(id){const u=(U.S.staff||[]).find(x=>x.id===id);if(!u||!u.active){U.toast('该演示账号已停用');return;}ui.staffId=u.id;const stores=U.myStores();if(!stores.includes(ui.opsStore))ui.opsStore=stores[0]||'sh';ui.posCart=[];ui.posSeat=U.S.stores[ui.opsStore].positions[0];if(!U.pageAllowed(ui.opsPage)){const first=U.firstPage(ui.surface);if(first)ui.opsPage=first;}render(true);U.toast(`已切换为 ${u.name} · ${U.D.roleNames(U.S,u)} · ${stores.length===Object.keys(U.S.stores).length?'全部门店':stores.map(s=>U.S.stores[s].short).join('、')}`);}

function about(){U.modal('一份可以走通的时叙 Demo',`<div class="eyebrow">FULL愈 · TEA HOUR / VERSION 7</div><h3 style="margin:8px 0 13px">把一杯茶，和日常连接起来。</h3><p class="small muted">顾客端、营业台、总部后台共用当前浏览器里的模拟数据。可从点单一路体验到出餐、零售交付、退款、补做和财务流水。</p><div class="demo-info-grid"><article><h3>顾客小程序</h3><p>GOOD DAY / CHILL / CHEERS / GOOD NIGHT 四系列、冷热筛选、手冲零售、瓶装庆系列、购物袋、会员与订单。</p></article><article><h3>平板营业台</h3><p>统一待出餐队列、杯贴扫码自动更新、会员码识别、两种付款码与现金入账、模拟平台新单；零售以 4 位提货码核验交付，输入即确认，鲜酿不增加领取核销。</p></article><article><h3>总部后台</h3><p>全局商品、分类、原料SKU映射与批量调整；门店只调本店库存和临时售罄。含按时间段经营概览、系列明细、财务流水与门店利润核算；已审批报损计入门店成本，人力、租金、总部管理费等运营费用可逐笔录入或一次导入多家门店，最终呈现门店净利。</p></article><article><h3>清楚的边界</h3><p>没有真实支付、打印、平台订单或会员服务；也不控制泡茶机。身份与审批均为本地模拟。</p></article></div><div class="note">权限演示：六个账号绑定角色与授权门店，只能切换到自己管理的门店；菜单和按钮按权限点过滤，越权页面显示无权限提示。退款满¥50进入总部财务复核，审批通过才写入退款流水；不满¥50且拥有退款权限的店长可直接处理。价格与规则占位：基础鲜酿¥20、特别单杯¥28、手冲单枚¥12；瓶装¥398来自本次参考。大会员¥365/年、指定鲜酿减¥2、满30减5券、1元1积分均为演示规则，待团队确定。瓶装不参与单杯减免。每杯3.5–4克为库存演示参数，实际配方由总部维护。冷热配置及包装视觉不是已确认产品规范。北京店仅展示筹备门店的操作模型。退款审批额度和审批人也是演示参数，正式阈值与复核层级待财务确认。</div><p class="small muted" style="margin-top:14px">已演示：无手机号点单、支付前门店确认、门店切换、售罄拦截、支付失败重试、逐杯扫码出餐、部分退款、打印异常、补做、零售提货码核验、门店报损与月度损耗预警、批量商品调整、SKU映射、追加式财务流水、运营费用多店导入与门店净利；账号角色、授权门店范围、权限过滤菜单、越权拦截与满额退款审批。未实现：真实平台同步、真实离线收款、物流和远程自提、生产级并发与统一身份认证（SSO）。身份与权限模型按“共用内核、独立业务域”设计：账号、角色、权限点、门店范围和审批引擎可复用在场的实现，时叙的菜单、角色与退款规则保持独立，原型不是可营业的收银系统。</p><hr class="divider"><div class="flex between"><span class="small muted">数据只保存在本地浏览器，可随时重置。</span>${b('重置演示数据','reset-confirm','btn compact')}</div>`,{wide:true,type:'about'});}
function chooseStore(target='customer',next){const current=target==='customer'?ui.store:ui.opsStore;if(target==='ops'&&next&&!U.myStores().includes(next)){U.toast('该门店不在当前账号的授权范围内');render();return;}if(next&&next!==current&&((target==='customer'?ui.cart:ui.posCart).length)){U.modal('切换门店，重新确认商品',`<p>购物袋属于当前门店。切换至<strong>${e(U.S.stores[next].name)}</strong>会清空当前未支付草稿；已付款订单保留。</p><div class="sheet-footer">${b('暂不切换','close','btn')}${b('清空草稿并切换','confirm-store','btn primary',`data-store="${next}" data-target="${target}"`)}</div>`,{type:'store-confirm'});return;}
 if(next){setStore(target,next);return;}const ids=target==='ops'?U.myStores():Object.keys(U.S.stores);U.modal(target==='ops'?'切换授权门店':'今天，在哪一间时叙？',`<p class="small muted">${target==='ops'?'只能切换当前账号被授权的门店；门店范围由总部维护。':'门店地址为筹备信息，本原型不代表实际开放情况。'}</p><div class="stack" style="margin-top:18px">${ids.map(id=>{const s=U.S.stores[id];return b(`<span class="grow" style="text-align:left"><strong>${e(s.name)}</strong><span class="small muted" style="display:block">${id==='sh'?'吧台与窗边 · 12个送达位置':'筹备门店 · 小桌与吧台演示'}</span></span>${id===current?i('check',18):i('chevron',18)}`,'store-select','btn',`data-store="${id}" data-target="${target}"`);}).join('')}</div>`,{type:'store'});}
function setStore(target,id){if(target==='ops'){if(!U.myStores().includes(id)){U.toast('该门店不在当前账号的授权范围内');render();return;}ui.opsStore=id;ui.posCart=[];ui.posSeat=U.S.stores[id].positions[0];}else{ui.store=id;ui.cart=[];ui.seat=U.S.stores[id].positions[0];ui.coupon=false;}U.close();render(true);U.toast('已切换至'+U.S.stores[id].name);}

function confirmPayment(){const d=U.modalData;let change=0;if(d.cash){const actual=Number(document.getElementById('cash-received').value);if(!Number.isFinite(actual)||actual*100<d.total)throw Error('实收金额不能少于应收金额');change=Math.round(actual*100)-d.total;}

function refundForm(id){const o=D.getOrder(U.S,id);U.modal(`${o.number} · 模拟退款`, `<p class="small muted">按原订单分摊后的实付金额退款，不超过剩余可退金额。</p><div class="form-row"><label for="refund-line">退款商品</label><select id="refund-line" data-change="refund-line"><option value="all">整单剩余商品</option>${o.items.map((l,n)=>l.qty>l.refundedQty?`<option value="${n}">${e(l.name)} · 可退${l.qty-l.refundedQty}${l.unit}</option>`:'').join('')}</select></div><div class="form-row" id="refund-qty-row" hidden><label for="refund-qty">退款数量</label><input id="refund-qty" type="number" min="1" step="1" value="1"></div><div class="form-row"><label for="refund-reason">原因</label><select id="refund-reason"><option>顾客改变计划</option><option>临时缺货</option><option>服务补偿</option><option>重复下单</option></select></div><label class="checkbox-label"><input id="refund-prepared" type="checkbox" checked ${o.status==='ready'?'disabled':''}>原料已经使用，不退回库存</label><p class="tiny muted" style="margin:10px 0">如果确认尚未制作，可取消勾选释放预留。已出餐订单不回库。全退恢复演示优惠券，按比例退回演示积分。</p><div class="sheet-footer">${b('返回订单','order-detail','btn',`data-id="${id}"`)}${b('确认模拟退款','confirm-refund','btn primary',`data-id="${id}"`)}</div>`,{type:'refund',data:{id}});}

function payment(pos=false,cash=false,skipStoreCheck=false){const r=pos?ui.posCart[0]&&D.product(U.S,ui.posCart[0].id).kind==='retail':Customer.kind()==='retail';const q=Customer.cartQuote(pos);if(!q.items.length)throw Error(t('购物袋还是空的','Your bag is empty.'));if(!pos&&!r&&!skipStoreCheck){if(!ui.storeSelected){showStores();U.toast(t('请先选择取茶门店','Choose a tea store first.'));return;}confirmStoreBeforePay();return;}const key=`PAY-${Date.now()}-${Math.random().toString(36).slice(2)}`,store=pos?ui.opsStore:ui.store,payModes=pos&&!cash?`<div class="mode-toggle pay-mode-toggle" role="group" aria-label="${t('收款方式','Payment method')}">${b(t('顾客扫我们的码','Customer scans us'),'pay-mode',ui.posPayMode!=='scan'?'active':'','data-mode="qr"')}${b(t('我们扫顾客的码','We scan customer'),'pay-mode',ui.posPayMode==='scan'?'active':'','data-mode="scan"')}</div>${ui.posPayMode==='scan'?`<div class="scan-frame compact" role="img" aria-label="${t('顾客付款码扫描框','Customer payment code frame')}">${i('scan',30)}</div><p class="note">${t('用摄像头或扫码枪读取顾客付款码；原型不调用摄像头。','Read the customer payment code with a scanner. No camera is accessed in this prototype.')}</p>`:`<div class="qr-demo" role="img" aria-label="${t('本单收款码示意','Order payment QR')}"><span>${t('本单收款码<br>不可扫描','Order QR<br>Not scannable')}</span></div><p class="note">${t('顾客扫码后确认金额与会员权益；原型不连接支付。','The customer scans to confirm amount and benefits. Payment is not connected.')}</p>`}`:'';U.modal(cash?'确认现金已收':t('模拟支付','Simulated payment'),`<div class="centered"><div class="eyebrow">NO REAL CHARGE</div><h3 class="payment-amount">¥${m(q.total)}</h3><p class="small muted">${r?t('零售 · 任意门店领取，不邮寄','Retail · Pickup at any store, no shipping'):e(sn(U.S.stores[store]))+' · '+(pos?ui.posType==='dine'?ui.posSeat:'现场外带':ui.type==='dine'?spec(ui.seat):t('现场外带','Takeaway'))}</p></div>${payModes}${cash?`<div class="form-row"><label for="cash-received">实收现金（元）</label><input id="cash-received" type="number" step="0.01" value="${q.total/100}"></div>`:''}<p class="note s function confirmPayment(){if(U.modalType!=='payment')return;const d=U.modalData,q=Customer.cartQuote(d.pos);if(JSON.stringify(q)!==d.quote)throw Error(t('价格或优惠已更新，请关闭后重新确认付款金额','Price or benefits changed. Close and review checkout again.'));let change=0;if(d.cash){const n=Number(value('cash-received'));if(!Number.isFinite(n)||n*100<d.total)throw Error('实收金额不能少于应收金额');change=Math.round(n*100)-d.total;}const input={store:d.store,channel:d.pos?'assisted':'mini',type:d.pos?ui.posType:ui.type,seat:d.pos?ui.posSeat:ui.seat,lines:d.pos?ui.posCart:d.retail?ui.retailCart:ui.cart,vip:d.pos?ui.posMember&&U.S.member.vip:U.S.member.vip,coupon:!d.retail&&(d.pos?ui.posMember&&ui.posCoupon:ui.coupon),owner:d.pos&&!ui.posMember?'guest':'customer',method:d.cash?'现金（模拟）':'微信（模拟）',key:d.key};const o=d.retail?D.placeRetailOrder(U.S,input):D.placeOrder(U.S,input);if(d.pos){ui.posCart=[];ui.posCoupon=false;ui.opsPage=d.retail?'retail':'workbench';}else{if(d.retail)ui.retailCart=[];else{ui.cart=[];ui.coupon=false;ui.storeConfirmed=false;}ui.currentOrder=o.id;ui.screen='receipt';}U.close();render(true);U.toast(o.number+' · '+(d.retail?t('可到任意门店领取','Ready to collect at any store'):t('已进入待出餐','Added to the preparation queue'))+(change?' · 找零¥'+m(change):''));}
function timeline(o,customer=false){const map={created:['提交订单','Order submitted'],payment:['模拟支付成功','Simulated payment confirmed'],ready:['整单已出餐','Order ready'],cup_ready:['逐杯出餐','Cup ready'],delivered:['门店确认已交付','Store confirmed handover'],refund:['模拟退款','Simulated refund'],print:['杯贴任务','Cup-label task'],remake:['补做免收款','Remake at no charge'],remake_link:['关联补做单','Remake linked'],seat:['修改送达位置','Serving location updated'],undo_ready:['撤回出餐','Returned to preparation']};return `<ol class="timeline">${U.S.logs.filter(l=>l.orderId===o.id).sort((a,b)=>a.at-b.at||Number(a.id.split('-').pop())-Number(b.id.split('-').pop())).map(l=>`<li><time>${new Date(l.at).toLocaleString(t('zh-CN','en-GB'),{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'})}</time><div><strong>${customer?t(...(map[l.type]||[l.action,l.action])):e(l.action)}</strong>${l.amount!==undefined?`<span> · ¥${m(l.amount)}</span>`:''}<p class="small muted">${customer?t(l.type==='delivered'?U.S.stores[l.storeId]?.name||'':l.actor,l.type==='delivered'?U.S.stores[l.storeId]?.nameEn||'':'Local demo record'):e(l.detail)+' · '+e(l.actor)}</p></div></li>`).join('')}</ol>`;}

function about(){U.modal(t('关于时叙 V7 原型','About Tea Hour V6'),`<div class="eyebrow">INTERACTIVE PROTOTYPE / VERSION 7</div><h3 class="section-space">${t('一杯留在此刻，一份带回日常。','A cup for now. A ritual for home.')}</h3><p class="note section-space">${t('本版按 2026-10-29 内部评审更新：会员码收进个人页右上角的二维码小图标，不再占用一级页面；杯贴取消逐杯按钮，扫码枪扫到即自动更新这一杯，全部完成自动出餐，仍可撤回最近一杯；零售提货码改为订单号下方的 4 位数字，输入或扫入即确认交付，不再单独勾选；财务新增门店利润核算，审批通过的报损作为门店成本扣除；人力、租金、总部管理费等运营费用可手动录入，或按日期、门店、类别、金额、备注一次导入多家门店，报表最终给出门店净利与净利率。仍保留支付前确认门店、桌签、会员扫码、两种付款码与现金日结。','Updated from the 29 Oct 2026 review: the member code now sits behind a small QR icon in the profile instead of a first-level card; cup labels no longer need a button, a scanner updates each cup automatically and the order becomes ready when all are done, with single-cup undo; retail pickup codes are four digits shown under the order number, and entering or scanning the code is the confirmation with no extra checkbox; finance adds store P&L, deducting approved loss as a store cost, plus manual entry or multi-store CSV import of labor, rent and HQ management fees to show net profit and net margin. Store confirmation, table QR, member scan, two payment-code modes and cash settlement remain.')}</p><p class="note section-space">${t('门店可登记报损并立即扣减本店库存；单笔达到演示审批线时提交总部复核，审批通过只确认责任，不恢复实物库存。总部按“本月已确认报损 / 本月营业额”监控月度损耗率，超过预警线会在经营概览提示；拆分报损仍会在月度合计中暴露。审批通过后还会作为门店成本进入财务利润核算。运营费用是独立费用表，不与订单流水混记；导入按日期、门店、类别、金额、备注去重，作废后不再计入净利。补做消耗原料，但不计报损。','Stores can report loss and deduct stock immediately; losses above the demo threshold go to HQ, where approval confirms accountability but does not restore stock. Approved loss is also deducted as a store cost in the finance P&L. Operating expenses use a separate expense table, never mixed into order ledger entries; imports dedupe on date, store, category, amount and memo, and voided rows stop affecting net profit. HQ watches monthly loss as approved loss divided by gross sales, warns when a store exceeds the ratio, and split reports still show up in the monthly total. Remakes consume stock but are not loss.')}</p><p class="note section-space">${t('顾客端中英切换、多城选店、鲜酿结算、零售任意店领取，与营业台和管理后台共用本地数据。门店地址坐标、商品配方、零售价格和包装均为示例。会员年费365元、单杯减2元、满30减5券、1元1积分只是演示规则，不是正式政策。','Bilingual ordering, multi-city stores, fresh tea and any-store retail pickup share local data with the workbench and admin. Store addresses, recipes, retail prices and packaging are illustrative. Membership ¥365/year, ¥2 cup savings, a ¥5-off-¥30 voucher and one point per yuan are demonstration rules, not confirmed policies.')}</p><p class="small section-space">${t('后台演示账号、角色、权限点与授权门店范围参考在场权限模型：一个账号只能切换被授权的门店，菜单与按钮按权限点过滤，越权访问会显示拦截页。满 ¥50 的退款需提交总部财务复核；低于阈值且有直接退款权限时立即生效。这些规则都是为了演示边界，不是上线批准。','Admin accounts, roles, permission points and store scope follow the Presence RBAC model: an account may only switch among its authorized stores, menus and buttons are permission-filtered, and out-of-scope access shows a denial page. Refunds of ¥50 or more go to HQ finance for approval; below the threshold a permitted manager may refund directly. These are demonstration rules, not an approval to launch.')}</p><p class="small section-space">${t('生产建议共用身份 / 角色 / 权限点 / 门店范围 / 审批引擎内核，但时叙保留自己的菜单、角色、退款规则与业务数据，不与在场后台外壳合并。','Production proposal: share the identity, role, permission, store-scope and approval engine, while Tea Hour keeps its own menus, roles, refund rules and business data. Do not merge it into the Presence admin shell.')}</p><p class="small section-space">${t('定位经浏览器授权后只用于本页计算示例距离，不上传。可拒绝定位并手动选店。草稿、账户与订单仅保存于当前浏览器；没有真实支付、打印、会员、外卖或在场库存写入。','Browser location is used locally to calculate example distances, never uploaded. You can decline and choose manually. Drafts, profiles and orders stay in this browser. Payments, printing, membership, delivery platforms and Presence inventory are not connected.')}</p><p class="small section-space">${t('在场联动参考验收入库的仓库、商品、实收明细，时叙适配映射为原型方案。正式系统仍需服务端鉴权、事务、幂等、审计与跨店库存调拨。','Presence integration follows its receipt / warehouse / accepted-item structure. The mapping is a prototype proposal. Production still needs server authorization, transactions, idempotency, audit and inter-store transfers.')}</p>${b(t('重置演示数据','Reset demo data'),'reset-confirm','btn full section-space')}`,{wide:true,type:'about-v2'});}
