:root{--paper:#f6f4ef;--canvas:#eeece6;--card:#fffefa;--ink:#352f2b;--muted:#68625b;--line:#dedbd3;--wood:#694b3d;--accent:#a26843;--apricot:#f1deca;--sage:#dde5d9;--rose:#edd9cf;--lilac:#e5e0ee;--blue:#e0e9ed;--success:#46684f;--danger:#a34338;--warning:#86571d;--shadow:0 14px 55px #352f2b15;--r-sm:10px;--r:18px;--r-lg:28px;--ease:160ms ease;--font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--canvas);font-family:var(--font);color:var(--ink);font-size:14px;line-height:1.6}button,input,select,textarea{font:inherit;color:inherit}button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}button{cursor:pointer;border:0;background:none;transition:background var(--ease),transform var(--ease)}button:disabled{cursor:not-allowed;opacity:.48}button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}a{color:inherit}h1,h2,h3,h4,p{margin:0}h1,h2,h3,h4{font-weight:550}svg{flex-shrink:0;vertical-align:middle}button svg{pointer-events:none}input,select,textarea{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;background:var(--card);max-width:100%}input[type=checkbox]{accent-color:var(--wood);width:18px;height:18px}textarea{width:100%;resize:vertical;min-height:76px}button:hover:not(:disabled){filter:brightness(.97)}.muted{color:var(--muted)}.small{font-size:12px}.tiny{font-size:11px}.eyebrow{font-size:10px;letter-spacing:2px;font-weight:600;text-transform:uppercase;color:var(--muted)}.serif{font-family:Georgia,"Songti SC","STSong",serif}.flex{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}.stack{display:flex;flex-direction:column;gap:14px}.divider{border:0;border-top:1px solid var(--line);margin:18px 0}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);border-radius:10px;min-height:44px;padding:10px 17px;background:var(--card);font-weight:500}.btn.primary{background:var(--ink);color:var(--card);border-color:var(--ink)}.btn.soft{background:var(--paper);border-color:transparent}.btn.danger{color:var(--danger);border-color:#dcbeb9}.btn.compact{padding:7px 12px;min-height:38px;font-size:12px}.btn.full{width:100%}.text-btn{padding:8px 0;display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--wood);min-height:40px}.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card)}.pill{display:inline-flex;align-items:center;gap:5px;border-radius:6px;background:var(--paper);padding:3px 8px;font-size:11px;white-space:nowrap}.pill.green{color:var(--success);background:#eaf0e7}.pill.amber{background:#f5e8d2;color:var(--warning)}.pill.red{background:#f8e8e3;color:var(--danger)}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor}.note{font-size:12px;line-height:1.75;color:var(--muted);background:var(--paper);padding:12px 14px;border-radius:10px}.notice{padding:12px 16px;background:#f5e8d2;color:#654719;border:1px solid #e9d1a8;border-radius:12px;margin-bottom:16px;display:flex;align-items:center;gap:10px}.error-inline{color:var(--danger);background:#f8e8e3;padding:12px;border-radius:10px;margin:12px 0}.empty{padding:42px 16px;text-align:center;color:var(--muted)}.empty h3{color:var(--ink);margin:12px 0 5px}.empty .btn{margin-top:16px}.price{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}.price small{font-size:12px;font-weight:400}.badge-count{font-variant-numeric:tabular-nums}.brand{font-weight:600;letter-spacing:1px;font-size:17px}.brand small{display:block;font-size:9px;letter-spacing:3px;font-weight:400;margin-top:0}.app-top{height:66px;background:var(--card);border-bottom:1px solid var(--line);padding:0 28px;display:flex;align-items:center;justify-content:space-between;gap:20px;position:relative;z-index:20}.app-top .brand{font-size:16px}.surface-switch{display:flex;background:var(--paper);padding:4px;gap:3px;border-radius:12px}.surface-switch button{padding:8px 19px;border-radius:9px;min-height:38px;color:var(--muted);font-size:13px}.surface-switch button.active{background:var(--ink);color:var(--card)}.demo-tag{border:1px solid var(--line);font-size:11px;border  let toastTimer;

 let modalType='',modalData={};

 function dateTime(n){return new Date(n).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});}
 function empty(title,sub,action=''){return `<div class="empty">${icon('cup',35)}<h3>${title}</h3><p class="small">${sub}</p>${action}</div>`;}

 function productRow(p,pos=false){const sold=!D.available(U.S,pos?ui.opsStore:ui.store,p.id);return `<article class="product-row">${art(p)}<div class="grow"><h3>${e(p.name)}</h3><p class="tag">${e(p.tag)}${p.kind==='tea'?' · '+p.temps.join(' / '):''}</p><div class="flex between"><div><span class="price">¥${m(p.price)}</span><span class="tiny muted"> / ${p.unit}</span>${p.memberEligible?`<div class="tiny muted">大会员 ¥${m(D.unitPrice(p,true))} · 演示权益</div>`:''}</div>${b(sold?'售罄':i('plus',18),'product',sold?'pill':'add-btn',`data-id="${p.id}" ${pos?'data-pos="true"':''} aria-label="选择${e(p.name)}"`,sold)}</div></div></article>`;}
 function menu(){
 const s=D.SERIES.find(s=>s.id===ui.series);let list=U.S.products.filter(p=>p.kind!=='retail'&&(ui.series==='all'||p.series===ui.series));
 if(ui.temp!=='全部')list=list.filter(p=>p.temps.includes(ui.temp));if(ui.flavor!=='全部')list=list.filter(p=>D.FLAVORS[p.flavor].name===ui.flavor);if(ui.query)list=list.filter(p=>(p.name+p.tag).includes(ui.query));const total=list.length;if(!ui.menuAll&&!ui.query)list=list.slice(0,3);
 return `${locationBar()}<div class="page-heading"><div class="eyebrow">${s?s.en:'THE TEA MENU'}</div><h1 class="serif">${s?s.phrase:'喜欢的茶，直接点。'}</h1><p>${ui.menuAll?'四个系列，五种香气线索。':`${s?s.note:''} 先看看这几杯。`}</p></div><div class="chips">${[['all','全部'],...D.SERIES.map(s=>[s.id,s.name])].map(([id,n])=>b(n,'menu-series',ui.series===id?'active':'',`data-series="${id}"`)).join('')}</div><div class="search">${i('search',16)}<input aria-label="搜索茶名或风味" id="tea-search" data-input="tea-search" placeholder="找茶名，或一种喜欢的香气" value="${e(ui.query)}"></div><div class="chips">${['全部','热','冰'].map(t=>b(t==='全部'?'冷热都可以':t==='热'?'想喝温热的':'想喝清凉的','temp-filter',ui.temp===t?'active':'',`data-temp="${t}"`)).join('')}</div><div class="product-list">${list.length?list.map(p=>productRow(p)).join(''):empty('这一刻，换一种选择','当前筛选下没有可售茶饮。',b('清除筛选','clear-filters','btn'))}${!ui.menuAll&&total>3?b(`查看这个系列全部 ${total} 款 ${i('arrow',15)}`,'show-all-series','text-btn full'):''}</div><div class="mini-pad"><p class="tiny muted" style="padding-top:14px">风味名、冷热与配方暂为设计草案。香气灵感不代表配料或功效。</p></div>`;
 }
 function retail(){return `${locationBar()}<div class="retail-intro"><div class="grow"><div class="eyebrow">A LITTLE RITUAL AT HOME</div><h2 class="serif">喜欢这一杯，<br>也带回家。</h2><p class="small muted" style="margin-top:8px">手冲飞碟杯 · 拆开，架杯，注水</p></div>${art(U.S.products.find(p=>p.id==='retail-2')).replace('class="product-thumb sage"','class="product-thumb sage"')}</div><div class="mini-pad"><div class="section-title"><h2>把香气留在日常</h2><small>POUR-OVER TEA</small></div><p class="small muted">与店内同款风味相连，冲泡结果随水温和手法略有不同。</p></div><div class="product-list">${U.S.products.filter(p=>p.kind==='retail').map(p=>productRow(p)).join('')}</div><div class="mini-pad"><p class="tiny muted" style="padding-top:14px">首发5款、单枚¥12为演示占位；包装规格及售价待确认。</p></div>`;}
 function cartLines(pos=false){const cart=pos?ui.posCart:ui.cart;return cart.map((l,n)=>{const p=D.product(U.S,l.id);return `<div class="checkout-item">${pos?'':art(p)}<div class="grow"><h3>${e(p.name)}</h3><p class="tiny muted">${[l.temp,l.ice].filter(Boolean).join(' · ')||'独立包装'}${!D.available(U.S,pos?ui.opsStore:ui.store,l.id)?' · 当前售罄':''}</p><span class="small">¥${m(p.price*l.qty)}</span></div><div class="qty">${b(i('minus',12),'cart-qty','',`data-index="${n}" data-delta="-1" data-pos="${pos}" aria-label="减少${e(p.name)}"`)}<span>${l.qty}</span>${b(i('plus',12),'cart-qty','',`data-index="${n}" data-delta="1" data-pos="${pos}" aria-label="增加${e(p.name)}"`)}</div></div>`;}).join('');}
 function bill(q){return `<div class="bill-line"><span>商品金额</span><span>¥${m(q.gross)}</span></div>${q.memberDiscount?`<div class="bill-line"><span>大会员单杯权益</span><span>−¥${m(q.memberDiscount)}</span></div>`:''}${q.couponDiscount?`<div class="bill-line"><span>茶饮券 · 演示</span><span>−¥${m(q.couponDiscount)}</span></div>`:''}<div class="bill-line bill-total"><span>合计</span><strong>¥${m(q.total)}</strong></div>`;}
 function checkout(){const q=cartQuote();return `<div class="page-heading"><div class="flex between">${b(i('back',17)+'继续选茶','back-menu','text-btn')}<span class="demo-tag">模拟结算</span></div><h1>确认这一单</h1><p>${e(U.store().name)} · ${ui.type==='dine'?'店内享用':'现场外带，不配送'}</p></div>${!ui.cart.length?empty('购物袋还是空的','先去选一杯喜欢的茶吧。',b('去选茶','full-menu','btn primary')):`<section class="mini-card"><div class="flex between"><h3 style="font-size:14px">${ui.type==='dine'?'送到你的位置':'做好后，到出餐口自取'}</h3>${b(ui.type==='dine'?e(ui.seat):'现场外带','choose-seat','text-btn')}</div><p class="tiny muted">${ui.type==='dine'?'位置只用于送茶，不与其他人的订单合并。':'无需扫码核销，看杯贴上的取餐号即可。'}</p></section><section class="mini-card">${cartLines()}</section><section class="mini-card">${U.S.member.vip?'<div class="pill green">已应用 Full愈大会员权益</div>':`<div class="flex between"><div><h3 style="font-size:13px">常来的你，可以再近一点。</h3><p class="tiny muted">大会员指定鲜酿每杯减¥2 · 规则暂拟</p></div>${b('了解','join','text-btn')}</div>`}<hr class="divider"><label class="checkbox-label"><input type="checkbox" data-change="coupon" ${ui.coupon?'checked':''} ${!U.S.member.couponAvailable||q.gross-q.memberDiscount<3000?'disabled':''}>使用满¥30减¥5茶饮券 <span class="tiny muted">演示</span></label>${bill(q)}</section><div class="mini-pad">${b('模拟微信支付 · ¥'+m(q.total),'pay-mini','btn primary full')}<p class="tiny muted" style="text-align:center;margin:12px 0">无需手机号即可点单。本演示不会实际扣款。</p></div>`}`;}
 function receipt(o){if(!o)return empty('还没有这笔订单','从茶单开始体验下单。',b('去选茶','full-menu','btn primary'));const ready=o.status==='ready',refunded=o.status==='refunded';return `<section class="receipt"><div class="receipt-circle">${i(refunded?'refresh':ready?'check':'cup',27)}</div><div class="eyebrow">${refunded?'REFUNDED':ready?'YOUR TEA IS READY':'MADE FOR THIS MOMENT'}</div><h2>${refunded?'本单已退款':ready?'你的茶，准备好了。':'茶正在准备，请稍坐。'}</h2><p class="small muted">${e(U.S.stores[o.store].name)} · ${e(U.orderLabel(o))}</p><div class="order-number">${o.number}</div><p class="small muted">${ready?(o.type==='dine'?'伙伴会将茶送到你的位置。':'请按杯贴上的取餐号，在出餐口自取。'):'这个号码，是我们找到彼此的方式。'}</p><div class="steps"><span class="done">已支付</span><span class="${!refunded?'done':''}">待出餐</span><span class="${ready?'done':''}">已出餐</span></div><div class="mini-card">${o.items.map(l=>`<div class="bill-line"><span>${e(l.name)} ×${l.qty}${l.refundedQty?`（已退${l.refundedQty}）`:''}</span><span>${e(l.temp)}</span></div>`).join('')}<hr class="divider"><div class="bill-line"><span>模拟支付</span><strong>¥${m(o.total-o.refunded)}</strong></div><p class="tiny muted">订单号 ${o.id}</p></div>${b('去营业台看这一单 '+i('arrow',16),'go-workbench','btn primary full',`data-store="${o.store}"`)}${b('再选一杯','full-menu','text-btn')}<p class="tiny muted">不设置领取核销；已出餐不等于已领取。</p></section>`;}
 function orders(){const list=U.S.orders.filter(o=>o.owner==='customer');return `<div class="page-heading"><div class="eyebrow">YOUR MOMENTS</div><h1>喝过的，都在这里。</h1><p>仅展示当前演示顾客的订单。</p></div>${list.length?list.map(o=>`<section class="mini-card"><div class="flex between"><h3>${o.number}</h3><span class="pill ${o.status==='ready'?'green':''}">${o.status==='ready'?'已出餐':o.status==='refunded'?'已退款':'待出餐'}</span></div><p class="small muted">${e(U.S.stores[o.store].name)} · ${e(U.orderLabel(o))}</p><p class="small" style="margin:10px 0">${o.items.map(l=>e(l.name)+' ×'+l.qty).join('、')}</p><div class="flex between"><strong>¥${m(o.total-o.refunded)}</strong>${b('查看订单 '+i('chevron',14),'receipt','text-btn',`data-id="${o.id}"`)}</div></section>`).join(''):empty('第一杯，还在等你','选茶、模拟支付后，订单会出现在这里。',b('去选茶','full-menu','btn primary'))}`;}
 function profile(){return `<div class="page-heading"><div class="eyebrow">A FULLER EVERYDAY</div><h1>留点时间，给自己。</h1><p>你好，时叙的朋友。</p></div><section class="member-card"><div class="eyebrow">FULL愈 MEMBERSHIP</div><h2>${U.S.member.vip?'Full愈 大会员':'一份会员，更多日常。'}</h2><p>${U.S.member.vip?'有效期一年 · 本地演示资格':'在时叙喝茶，也在 Full愈的其他日常里相遇。'}</p>${b(U.S.member.vip?'查看我的权益':'了解大会员 · ¥365 / 年','join','btn')}</section><div class="mini-stats"><div><strong>${U.S.member.points.toLocaleString()}</strong><span>全品牌共享积分 · 模拟</span></div><div><strong>${U.S.member.couponAvailable?1:0}</strong><span>可用优惠券 · 模拟</span></div></div><section class="mini-card">${b(`<span class="grow" style="text-align:left">${i('orders',17)} 我的订单</span>${i('chevron',16)}`,'mini-nav','flex full','data-screen="orders"') }<hr class="divider">${b(`<span class="grow" style="text-align:left">${i('bag',17)} 我的优惠券</span>${i('chevron',16)}`,'coupons','flex full')}<hr class="divider">${b(`<span class="grow" style="text-align:left">${i('info',17)} 关于这份 Demo</span>${i('chevron',16)}`,'about','flex full')}</section><div class="mini-pad"><p class="note">不做储值。会员与积分为统一账户的接口占位，不与外卖平台打通。年费和优惠规则待正式确认。</p></div>`;}
 function render(){const content={home,menu,retail,checkout,profile,orders,receipt:()=>receipt(U.S.orders.find(o=>o.id===ui.currentOrder))}[ui.screen]||home;const q=cartQuote();return `<section class="mini-stage"><aside class="preview-copy"><div class="eyebrow">FULL愈 · TEA HOUR</div><h1 class="serif">不止一杯茶，<br>是你的此刻。</h1><p>从当下的感受开始，<br>找到喜欢的香气。<br>剩下的，交给时叙。</p><div class="series-dots">${D.SERIES.map(s=>`<span class="series-dot ${s.color}">${s.name}</span>`).join('')}</div><p class="tiny" style="margin-top:28px">交互原型 V1 · 视觉与产品方案待评审</p></aside><div class="phone"><div class="phone-status"><span>9:41</span><span class="status-icons">${i('wifi',12)}<span>▰</span></span></div><header class="mini-header"><div class="brand">Full愈·时叙<small>TEA HOUR</small></div><div class="mini-capsule" aria-label="模拟微信胶囊"><span>···</span><span>◉</span></div></header><main class="phone-content" id="phone-content">${content()}</main>${ui.cart.length&&!['checkout','receipt'].includes(ui.screen)?`<div class="bag-bar"><div class="bag-icon">${i('bag',24)}<span>${ui.cart.reduce((n,l)=>n+l.qty,0)}</span></div><div class="grow"><span class="price">¥${m(q.total)}</span><p class="tiny" style="color:#d8d0c7">${ui.type==='dine'?e(ui.seat):'现场外带'} · ${e(U.store().short)}</p></div>${b('选好了','checkout','')}</div>`:''}<nav class="nav-bottom" aria-label="小程序导航">${navItems.map(([id,ic,n])=>b(i(ic,20)+`<span>${n}</span>`,'mini-nav',ui.screen===id?'active':'',`data-screen="${id}"`)).join('')}</nav></div><aside class="preview-note"><div class="eyebrow">TRY THE WHOLE JOURNEY</div><h3>一次完整的点茶体验</h3>${[['01','从此刻开始','选一个系列，再选冷热。'],['02','把订单交给时叙','模拟支付，无需手机号。'],['03','在营业台完成出餐','切换顶部标签，查看同一笔订单。']].map(([n,t,d])=>`<div class="journey-step"><span class="num">${n}</span><div><b>${t}</b><span class="muted">${d}</span></div></div>`).join('')}<hr class="divider"><p class="tiny muted">仅在当前浏览器保存演示数据。<br>没有真实扣款、消息或打印。</p></aside></section>`;}
 function productSheet(id,pos=false,data){const p=D.product(U.S,id);const d=data||{id,pos,temp:p.temps.includes(ui.temp)?ui.temp:p.temps[0]||'',ice:p.ice?'标准冰':'',qty:1};const vip=pos?ui.posMember&&U.S.member.vip:U.S.member.vip;U.modal('选一杯，给此刻',`${art(p,'product-showcase')}<div class="flex between"><div><div class="eyebrow">${D.SERIES.find(s=>s.id===p.series).en}</div><h3>${e(p.name)}</h3></div><div class="price">¥${m(D.unitPrice(p,vip))}<small> / ${p.unit}</small></div></div><p class="small muted" style="margin-top:8px">${e(p.desc)}</p>${p.temps.length?`<div class="option-title">${p.kind==='bottle'?'饮用状态':'温度'}</div><div class="options">${p.temps.map(t=>b(t,'product-temp',`option ${d.temp===t?'selected':''}`,`data-temp="${t}"`)).join('')}</div>`:''}${p.ice&&d.temp==='冰'?`<div class="option-title">冰量</div><div class="options">${['标准冰','少冰'].map(t=>b(t,'product-ice',`option ${d.ice===t?'selected':''}`,`data-ice="${t}"`)).join('')}</div>`:''}<p class="note" style="margin-top:16px">${p.kind==='bottle'?'¥398为瓶装参考价；香槟式开瓶仪式，无酒精产品方向。容量、包装和成分以最终产品为准。瓶装不参与单杯减免。':p.kind==='retail'?'单枚¥12为演示价；包装及正式冲泡参数待确认。':'纯茶鲜酿，不选浓淡、不选杯型。风味、冷热与价格暂为原型草案，不是最终配方或功效说明。'}</p><div class="sheet-footer"><div class="qty">${b(i('minus',13),'product-qty','',`data-delta="-1" aria-label="减少数量"`,d.qty<=1)}<span>${d.qty}</span>${b(i('plus',13),'product-qty','',`data-delta="1" aria-label="增加数量"`,d.qty>=20)}</div>${b(`加入${pos?'本单':'购物袋'} · ¥${m((D.unitPrice(p,vip))*d.qty)}`,'add-product','btn primary grow')}</div>`,{type:'product',data:d});}
 return {render,productSheet,cartQuote,cartLines,bill,productRow};
})();
</script><script>window.Ops=(()=>{
 const {D,ui,esc:e,money:m,icon:i,btn:b,art,empty}=U;
 const pages=[['workbench','grid','营业台'],['pos','plus','帮客人点单'],['orders','orders','订单记录'],['products','cup','商品与库存'],['dashboard','chart','经营概览'],['stores','store','门店与设备'],['logs','shield','操作记录']];
 const orders=()=>U.S.orders.filter(o=>o.store===ui.opsStore);
 const channelName=o=>({mini:'小程序',assisted:'伙伴代点',meituan:'美团外卖',taobao:'淘宝闪购'}[o.channel]);
 function stat(label,value,unit,sub,emphasis=false){return `<article class="stat ${emphasis?'emphasis':''}"><div class="label">${label}</div><div class="value">${value}<small>${unit}</small></div><div class="sub">${sub}</div></article>`;}
 function card(o){const qty=D.cupCount(o);return `<article class="order-card ${U.elapsed(o)>=8?'urgent':''}" data-order="${o.id}"><div class="order-card-head"><div><h3>${o.number}</h3><span class="tiny muted">${channelName(o)}${o.parent?' · 补做':''}</span></div><span class="time">${i('clock',12)} ${U.elapsed(o)}分钟</span></div><div class="order-channel"><span class="pill ${o.type}">${e(U.orderLabel(o))}</span><span class="tiny muted">${qty?qty+'杯':o.items.reduce((n,l)=>n+l.qty-l.refundedQty,0)+'件 · 无需泡茶'}</span></div><div class="order-items">${o.items.filter(l=>l.qty>l.refundedQty).map(l=>`<div class="order-line"><div><h4>${e(l.name)}</h4><p>${[l.temp,l.ice].filter(Boolean).join(' · ')||'零售 · 直接备货'}${l.kind==='bottle'?' · 整瓶出品':l.kind==='retail'?' · 别忘了拿':''}</p></div><span class="line-qty">×${l.qty-l.refundedQty}</span></div>`).join('')}</div>${o.note?`<p class="order-card-note">${e(o.note)}</p>`:''}<div class="print-hint">${i(o.printStatus==='queued'?'info':'print',12)} ${o.printStatus==='queued'?'<span style="color:var(--danger)">杯贴等待处理</span>':o.printStatus==='none'?'无需打印杯贴':'杯贴已模拟打印'}</div><div class="order-card-footer">${b(i('check',15)+(qty?'整单已出餐':'整单已备好'),'finish','btn primary',`data-id="${o.id}"`)}${b(i('more',18),'order-detail','icon-btn',`data-id="${o.id}" aria-label="处理订单${o.number}"`)}</div></article>`;}
 function workbench(){const list=orders(),pending=list.filter(o=>o.status==='pending'),ready=list.filter(o=>o.status==='ready');const filtered=pending.filter(o=>ui.filter==='all'||(ui.filter==='platform'?o.type==='delivery':o.type===ui.filter));const longest=pending.length?Math.max(...pending.map(U.elapsed)):0;return `<div class="stats-grid">${stat('待出餐',pending.reduce((n,o)=>n+D.cupCount(o),0),'杯',`${pending.length} 笔订单 · 含零售 / 整瓶`,true)}${stat('正在等待',pending.length,'单','只需一次整单出餐操作')}${stat('最长等待',longest,'分钟','按实际已等时长，不承诺倒计时')}${stat('今日已出餐',ready.length,'单','无需确认领取或送达')}</div><div class="queue-heading"><div class="flex"><h2>待出餐 <span class="muted small">${pending.length}</span></h2><span class="pill">按下单时间</span></div><div class="chips">${[['all','全部'],['dine','堂食'],['takeaway','现场外带'],['platform','平台外卖']].map(([id,n])=>b(n,'queue-filter',ui.filter===id?'active':'',`data-filter="${id}"`)).join('')}</div></div><div class="board"><div class="pending-grid">${filtered.length?filtered.sort((a,b)=>a.createdAt-b.createdAt).map(card).join(''):`<div style="grid-column:1/-1">${empty(pending.length?'这个分类下暂时没有订单':'当前订单已处理完',pending.length?'其他类型的订单仍在全部列表中。':'可以继续帮客人点单，新单会出现在这里。',b(pending.length?'查看全部':'帮客人点单',pending.length?'queue-filter':'ops-nav','btn',pending.length?'data-filter="all"':'data-page="pos"'))}</div>`}</div><aside class="recent-panel"><div class="section-title"><h3>最近出餐</h3><span class="tiny muted">不追踪领取</span></div>${ready.length?ready.sort((a,b)=>b.readyAt-a.readyAt).slice(0,5).map(o=>`<article class="recent-card"><div class="flex between"><h3>${o.number}</h3><span class="tiny muted">${U.dateTime(o.readyAt)}</span></div><span class="pill">${e(U.orderLabel(o))}</span><p>${o.items.map(l=>e(l.name)+' ×'+(l.qty-l.refundedQty)).join('<br>')}</p><div class="flex between">${b('查看 / 补做','order-detail','text-btn',`data-id="${o.id}"`)}${b('撤回出餐','undo-ready','text-btn',`data-id="${o.id}"`)}</div></article>`).join(''):empty('还没有出餐记录','做好一单后，会出现在这里。')}<p class="tiny muted">堂食顺手送达；外带与外卖按杯贴自取。不再点“已领取”。</p></aside></div><div class="workbench-foot"><span>${i('shield',13)} 支付、外卖、云打印均为本地模拟</span><span>纯茶鲜酿 · 3台设备参考 · 可人工冲泡</span></div>`;}
 function orderTable(){const list=orders().filter(o=>(o.number+o.platformNo+o.items.map(l=>l.name).join('')).toLowerCase().includes(ui.orderSearch.toLowerCase()));return `<div class="table-tools"><div><h2 style="font-size:17px">本店全部订单</h2><p class="small muted">保留付款、退款与补做的独立记录</p></div><input id="order-search" data-input="order-search" aria-label="搜索订单" placeholder="搜取餐号、平台号、商品" value="${e(ui.orderSearch)}"></div><div class="table-wrap"><table><thead><tr><th>订单</th><th>来源 / 去向</th><th>商品</th><th>原实付</th><th>退款</th><th>状态</th><th>操作</th></tr></thead><tbody>${list.map(o=>`<tr><td><strong>${o.number}</strong><div class="tiny muted">${U.dateTime(o.createdAt)}</div></td><td>${channelName(o)}<div class="tiny muted">${e(U.orderLabel(o))}</div></td><td>${e(o.items[0].name)}${o.items.length>1?` 等${o.items.length}款`:''}${o.parent?'<div class="pill amber">补做，不计收入</div>':''}</td><td>¥${m(o.total)}</td><td>${o.refunded?'−¥'+m(o.refunded):'—'}</td><td><span class="pill ${o.status==='ready'?'green':o.status==='refunded'?'red':''}">${o.status==='ready'?'已出餐':o.status==='refunded'?'已退款':'待出餐'}</span></td><td>${b('详情 / 处理','order-detail','btn compact',`data-id="${o.id}"`)}</td></tr>`).join('')}</tbody></table>${!list.length?empty('没有找到订单','试试其他取餐号或商品名称。'):''}</div>`;}
 function products(){const st=U.store(ui.opsStore),list=U.S.products.filter(p=>(ui.productKind==='all'||p.kind===ui.productKind)&&(p.name+p.tag).includes(ui.productSearch));return `<div class="table-tools"><div class="chips" style="padding:0">${[['all','全部商品'],['tea','鲜酿茶'],['bottle','整瓶庆系列'],['retail','手冲零售']].map(([id,n])=>b(n,'product-filter',ui.productKind===id?'active':'',`data-kind="${id}"`)).join('')}</div><input id="product-search" data-input="product-search" aria-label="搜索商品" placeholder="搜索商品或香气" value="${e(ui.productSearch)}"></div><div class="note" style="margin-bottom:15px">每款茶对应独立散茶。演示下单预留标准用量；补做另计耗用，补打不扣库存。标准6克/杯为暂拟数值，不是实际配方。</div><div class="table-wrap"><table><thead><tr><th>商品 / 系列</th><th>售价</th><th>规格</th><th>本店可用库存</th><th>在售</th><th>操作</th></tr></thead><tbody>${list.map(p=>`<tr><td><div class="flex">${art(p)}<div><strong>${e(p.name)}</strong><div class="tiny muted">${p.id} · ${p.kind==='tea'?'独立散茶':p.kind==='bottle'?'瓶装成品':'手冲成品'}</div></div></div></td><td>¥${m(p.price)} / ${p.unit}</td><td>${p.temps.join(' / ')||'独立包装'}</td><td class="stock-count">${st.stock[p.id]} ${p.kind==='tea'?'克':p.unit}${p.kind==='tea'?`<div class="tiny muted">约可做 ${Math.floor(st.stock[p.id]/p.dose)} 杯</div>`:''}</td><td>${b('','sold-toggle',`switch ${!st.soldOut[p.id]?'on':''}`,`data-id="${p.id}" role="switch" aria-checked="${!st.soldOut[p.id]}" aria-label="${e(p.name)}在售开关"`)}</td><td>${b('调整','edit-product','btn compact',`data-id="${p.id}"`)}</td></tr>`).join('')}</tbody></table>${!list.length?empty('没有匹配的商品','可以切换分类或清除搜索。'):''}</div>`;}
 function dashboard(){const all=orders().filter(o=>!o.parent),sales=all.reduce((n,o)=>n+o.total,0),refund=all.reduce((n,o)=>n+o.refunded,0),own=all.filter(o=>!['meituan','taobao'].includes(o.channel)),platform=all.filter(o=>['meituan','taobao'].includes(o.channel));const channelStats=['mini','assisted','meituan','taobao'].map(ch=>({name:{mini:'小程序',assisted:'伙伴代点',meituan:'美团外卖',taobao:'淘宝闪购'}[ch],count:all.filter(o=>o.channel===ch).length}));const max=Math.max(1,...channelStats.map(s=>s.count));return `<div class="stats-grid">${stat('订单成交额','¥'+m(sales),'','模拟订单原实付总额',true)}${stat('自有渠道净收','¥'+m(own.reduce((n,o)=>n+o.total-o.refunded,0)),'','小程序 + 代点 · 已扣退款')}${stat('已退款','¥'+m(refund),'',`${U.S.refundCounter}次模拟退款记录`)}${stat('有效销量',all.reduce((n,o)=>n+D.cupCount(o),0),'杯','仅鲜酿，不含瓶装与零售')}</div><div class="panel-grid"><section class="panel"><div class="section-title"><div><div class="eyebrow">CHANNEL MIX</div><h2>顾客从哪里来</h2></div><span class="pill">本地样本 · ${all.length}单</span></div>${channelStats.map(s=>`<div class="bar-row"><span>${s.name}</span><div class="bar-track"><div class="bar-fill" style="width:${s.count/max*100}%"></div></div><span>${s.count} 单</span></div>`).join('')}<p class="tiny muted">图表直接来自当前演示订单，不是实际经营数据。</p></section><section class="panel"><div class="eyebrow">FOUR MOMENTS</div><h2>每个系列，被选择的时刻</h2><div class="series-sales">${D.SERIES.map(s=>{const count=all.reduce((n,o)=>n+o.items.filter(l=>D.product(U.S,l.id).series===s.id&&l.kind==='tea').reduce((a,l)=>a+l.qty-l.refundedQty,0),0);return `<div class="${s.color}"><span class="serif" style="font-size:25px">${s.name}</span><strong>${count}</strong><span class="tiny muted">杯</span></div>`;}).join('')}</div><p class="tiny muted" style="margin-top:20px">瓶装庆系列与零售单独统计，不混入鲜酿杯数。</p></section></div><div class="panel-grid"><section class="panel"><h2>平台订单，不等于到账</h2><div class="setting-row"><span>平台订单净成交</span><strong>¥${m(platform.reduce((n,o)=>n+o.total-o.refunded,0))}</strong></div><div class="setting-row">< pos-qr','btn primary full','',!ui.posCart.length)}${b('现金已收 · 确认出单','pos-cash','btn full','style="margin-top:9px"',!ui.posCart.length)}<p class="tiny muted" style="margin-top:12px">现金散客不需要手机号。支付均为模拟，不产生真实交易。</p></aside></div>`;}
 function render(){const st=U.store(ui.opsStore),pending=orders().filter(o=>o.status==='pending').length,meta={workbench:['营业台','做好一杯，照顾好眼前的每个人。'],pos:['帮客人点单','快一点完成点单，慢一点享受这杯茶。'],orders:['订单记录','找到一笔订单，也能灵活处理意外。'],products:['商品与库存','统一商品资料，各店独立在售与库存。'],dashboard:['经营概览','看清今天，不让数据打扰营业。'],stores:['门店与设备','保持简单，也给突发情况留好余地。'],logs:['操作记录','本地模拟记录，不连接真实经营系统。']}[ui.opsPage]||['营业台',''];return `<div class="ops-shell"><aside class="sidebar"><div class="sidebar-brand brand">Full愈·时叙<small>STORE OPERATIONS</small></div><div class="sidebar-label">日常营业</div>${pages.map(([id,ic,n],j)=>`${j===4?'<div class="sidebar-label">经营与管理</div>':''}${b(i(ic,19)+`<span>${n}</span>${id==='workbench'?`<span class="badge">${pending}</span>`:''}`,'ops-nav',`side-link ${ui.opsPage===id?'active':''}`,`data-page="${id}" title="${n}"`)}`).join('')}<div class="sidebar-bottom">V1 · 本地交互原型<br>模拟数据，不代表实际营业</div></aside><main class="ops-main"><header class="ops-header"><div><h1>${meta[0]}</h1><p>${meta[1]}</p></div><div class="ops-toolbar"><select aria-label="后台门店" data-change="ops-store"><option value="sh" ${ui.opsStore==='sh'?'selected':''}>上海·时叙店</option><option value="bj" ${ui.opsStore==='bj'?'selected':''}>北京·筹备店（演示）</option></select>${b(i('settings',16)+'异常演练','scenarios','btn')}${ui.opsPage!=='pos'?b(i('plus',17)+'帮客人点单','ops-nav','btn primary','data-page="pos"'):b('返回营业台','ops-nav','btn','data-page="workbench"')}</div></header><nav class="ops-subnav" style="display:none">${pages.map(([id,ic,n])=>b(n,'ops-nav',ui.opsPage===id?'active':'',`data-page="${id}"`)).join('')}</nav><div class="live-status"><span class="${st.open?'ok':''}"><span class="dot"></span> ${st.open?'接单中':'已暂停新单'}</span><span>${i('wifi',13)} 本地联动演示</span>${b(i('print',13)+` 云打印${st.printer==='online'?'在线':'异常'} · 模拟`,'printer','text-btn','style="min-height:auto;padding:0;font-size:11px"')}<span style="margin-left:auto">${new Date().toLocaleDateString('zh-CN')} · ${U.dateTime(Date.now())}</span></div>${!st.open?'<div class="notice">本店暂停新单。已收到的订单仍可正常出餐。</div>':''}${st.printer!=='online'?`<div class="notice">${i('print',17)}<span class="grow">标签机${st.printer==='paper'?'缺纸':'离线'}。订单仍保留，杯贴任务不会被当作已打印。</span>${b('处理','printer','btn compact')}</div>`:''}${({workbench,pos,orders:orderTable,products,dashboard,stores,logs}[ui.opsPage]||workbench)()}</main></div>`;}

</script><script>(()=>{

function render(resetScroll=false){const active=document.activeElement,focusId=active?.id,selection=typeof active?.selectionStart==='number'?active.selectionStart:null;const sc=document.getElementById('phone-content'),scroll=sc?.scrollTop||0;

 if(!resetScroll&&document.getElementById('phone-content'))document.getElementById('phone-content').scrollTop=scroll;

function about(){U.modal('一份可以走通的时叙 Demo',`<div class="eyebrow">FULL愈 · TEA HOUR / VERSION 1</div><h3 style="margin:8px 0 13px">把一杯茶，和日常连接起来。</h3><p class="small muted">顾客端、营业台与后台共用当前浏览器里的模拟数据。可从点单一路体验到出餐、退款和补做。</p><div class="demo-info-grid"><article><h3>顾客小程序</h3><p>四系列选茶、冷热筛选、手冲零售、瓶装庆系列、购物袋、会员与订单。</p></article><article><h3>平板营业台</h3><p>统一待出餐队列、快速代点、现金散客、模拟平台新单；不设置领取核销。</p></article><article><h3>后台管理</h3><p>商品在售与库存、部分退款、整单补做、打印重试、门店及经营概览。</p></article><article><h3>清楚的边界</h3><p>没有真实支付、打印、平台订单或会员服务；也不控制泡茶机。</p></article></div><div class="note">价格与规则占位：基础鲜酿¥20、特别单杯¥28、手冲单枚¥12；瓶装¥398来自本次参考。大会员¥365/年、指定鲜酿减¥2、满30减5券、1元1积分均为演示规则，待团队确定。瓶装不参与单杯减免。每杯6克为库存演示参数。冷热配置及包装视觉不是已确认产品规范。北京店仅展示筹备门店的操作模型。</div><p class="small muted" style="margin-top:14px">已演示：无手机号点单、门店切换、售罄拦截、支付失败重试、部分退款、打印异常、补做与库存变化。未实现：真实平台同步、真实离线收款、物流和远程自提、生产级并发与权限。原型不是可营业的收银系统。</p><hr class="divider"><div class="flex between"><span class="small muted">数据只保存在本地浏览器，可随时重置。</span>${b('重置演示数据','reset-confirm','btn compact')}</div>`,{wide:true,type:'about'});}
function chooseStore(target='customer',next){const current=target==='customer'?ui.store:ui.opsStore;if(next&&next!==current&&((target==='customer'?ui.cart:ui.posCart).length)){U.modal('切换门店，重新确认商品',`<p>购物袋属于当前门店。切换至<strong>${e(U.S.stores[next].name)}</strong>会清空当前未支付草稿；已付款订单保留。</p><div class="sheet-footer">${b('暂不切换','close','btn')}${b('清空草稿并切换','confirm-store','btn primary',`data-store="${next}" data-target="${target}"`)}</div>`,{type:'store-confirm'});return;}

 'product-filter':el=>{ui.productKind=el.dataset.kind;render();},'sold-toggle':el=>{const st=U.store(ui.opsStore);st.soldOut[el.dataset.id]=!st.soldOut[el.dataset.id];D.log(U.S,st.soldOut[el.dataset.id]?'临时售罄':'恢复在售',`${st.short} · ${D.product(U.S,el.dataset.id).name}`);render();U.toast('本店在售状态已更新，顾客端同步生效');},'edit-product':el=>editProduct(el.dataset.id),'save-product':el=>{const p=D.product(U.S,el.dataset.id),price=Number(document.getElementById('edit-price').value),stock=Number(document.getElementById('edit-stock').value);if(!Number.isFinite(price)||price<=0||price>20000||!Number.isInteger(stock)||stock<0)throw Error('请输入有效价格与非负整数库存');let temps=p.temps;if(p.kind==='tea'){temps=[];if(document.getElementById('edit-hot').checked)temps.push('热');if(document.getElementById('edit-cold').checked)temps.push('冰');if(!temps.length)throw Error('至少保留一种可售温度');}p.price=Math.round(price*100);p.temps=temps;U.store(ui.opsStore).stock[p.id]=stock;D.log(U.S,'调整商品',`${p.name} · 品牌价¥${price} · ${U.store(ui.opsStore).short}可用库存${stock}`);U.close();render();U.toast('商品已更新，历史订单不变');},
 printer,'printer-state':el=>{U.store(ui.opsStore).printer=el.dataset.status;D.log(U.S,'模拟设备状态',`${U.store(ui.opsStore).short} · ${el.dataset.status}`);const wasPrinter=U.modalType==='printer';render();if(wasPrinter)printer();},'store-toggle':()=>{const st=U.store(ui.opsStore);st.open=!st.open;D.log(U.S,st.open?'恢复接单':'暂停新单',st.short);render();},'channel-toggle':el=>{const st=U.store(ui.opsStore);st.channels[el.dataset.channel]=!st.channels[el.dataset.channel];D.log(U.S,'模拟渠道设置',`${st.short} · ${el.dataset.channel} · ${st.channels[el.dataset.channel]?'开启':'暂停'}`);render();},
 scenarios,'scene-printer':el=>{U.store(ui.opsStore).printer=el.dataset.status;D.log(U.S,'异常演练',el.dataset.status);U.close();render();U.toast('已模拟打印异常；下一单杯贴将进入待处理');},'scene-pause':()=>{U.store(ui.opsStore).open=!U.store(ui.opsStore).open;D.log(U.S,'异常演练',U.store(ui.opsStore).open?'恢复接单':'暂停接单');U.close();render();},'scene-finish':()=>{Ops.orders().filter(o=>o.status==='pending').forEach(o=>D.finishOrder(U.S,o.id));U.close();render();U.toast('已模拟批量出餐');},'simulate-order':el=>{const p=U.S.products.find(p=>p.basic&&D.available(U.S,ui.opsStore,p.id));if(!p)throw Error('暂无可售茶饮，请先恢复商品');const o=D.placeOrder(U.S,{store:ui.opsStore,channel:el.dataset.channel,type:'delivery',owner:'guest',lines:[{id:p.id,qty:1,temp:p.temps[0],ice:p.temps[0]==='冰'?'标准冰':''}],method:'平台支付（模拟）'});U.close();opsPage(ui.opsPage==='pos'?'pos':'workbench');U.toast(o.platformNo+' 新单已到达');},
 'reset-confirm':()=>U.modal('重置本地演示数据？',`<p>将清除本次演示的购物袋、订单、退款和配置，恢复最初样例。不会影响任何真实系统或源文件。</p><div class="sheet-footer">${b('取消','close','btn')}${b('确认重置','confirm-reset','btn danger')}</div>`,{type:'reset'}),'confirm-reset':()=>{U.S=D.seed(D.initialState());ui.cart=[];ui.posCart=[];ui.currentOrder=null;ui.screen='home';ui.store='sh';ui.opsStore='sh';ui.seat='吧台06';ui.posSeat='吧台01';ui.filter='all';ui.coupon=false;ui.posCoupon=false;ui.posMember=false;U.close();render(true);U.toast('已恢复初始演示数据');}
};
document.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(!el||el.disabled)return;const fn=actions[el.dataset.action];if(!fn)return;try{fn(el);}catch(err){if(U.modalType==='payment'&&document.getElementById('payment-error'))document.getElementById('payment-error').innerHTML=`<p class="error-inline">${e(err.message)}。未生成新订单。</p>`;U.toast(err.message||'操作未完成，请重试');}});
document.addEventListener('change',event=>{const el=event.target;try{switch(el.dataset.change){case'coupon':ui.coupon=el.checked;render();break;case'pos-coupon':ui.posCoupon=el.checked;render();break;case'pos-member':ui.posMember=el.checked;if(!el.checked)ui.posCoupon=false;render();break;case'pos-seat':ui.posSeat=el.value;U.persist();break;case'ops-store':chooseStore('ops',el.value);render();break;case'refund-line':document.getElementById('refund-qty-row').hidden=el.value==='all';break;}}catch(err){U.toast(err.message);}});
document.addEventListener('input',event=>{const el=event.target;switch(el.dataset.input){case'tea-search':ui.query=el.value;render();break;case'product-search':ui.productSearch=el.value;render();break;case'order-search':ui.orderSearch=el.value;render();break;}});
window.addEventListener('storage',event=>{if(event.key!==U.KEY||!event.newValue)return;try{const s=JSON.parse(event.newValue);if(s.version!==1)return;const oldCount=U.S.orders.length;U.S=s;render();if(s.orders.length>oldCount&&ui.surface!=='mini')U.toast('新订单已到达，营业台已更新');}catch{}});
window.addEventListener('hashchange',()=>surface(location.hash==='#manage'?'manage':location.hash==='#workbench'?'workbench':'mini'));
document.getElementById('sheet').addEventListener('click',event=>{if(event.target===event.currentTarget){const r=event.currentTarget.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)U.close();}});
document.getElementById('sheet').addEventListener('keydown',event=>{
 if(event.key!=='Tab')return;
 const controls=[...event.currentTarget.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled),a[href]')].filter(el=>el.getClientRects().length);
 const first=controls[0],last=controls[controls.length-1];
 if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus();}
 else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}
});
window.DemoApp={render,actions,surface};render(true);
})();
</script></body></html>
